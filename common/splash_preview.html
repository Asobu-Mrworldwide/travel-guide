<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スプラッシュ プレビュー</title>
</head>
<body style="margin:0;font-family:'Noto Sans JP',sans-serif">

<!-- スプラッシュ画面 -->
<div id="splash" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div id="splash-logo" style="width:120px;height:120px;background:#f0f4ff;border-radius:24px">
      <img src="素材/ロゴ.webp" alt="World Mappy" style="width:100%;height:100%;object-fit:contain;border-radius:24px;display:none" onload="this.style.display='block'">
    </div>
    <div style="font-size:1.8em;font-weight:900;color:#6495ed;letter-spacing:-0.5px">World Mappy</div>
    <div style="font-size:0.72em;color:#aaa;margin-top:-8px">まっぴー｜世界の旅行情報まとめ</div>
    <div style="width:160px;height:3px;background:#e4eaf5;border-radius:4px;overflow:hidden;margin-top:8px">
      <div id="bar" style="height:100%;width:0;background:#6495ed;border-radius:4px"></div>
    </div>
  </div>
</div>

<div style="padding:40px;text-align:center;color:#aaa">
  <p>スプラッシュ画面のプレビューページです</p>
  <button onclick="replay()" style="margin-top:20px;padding:8px 20px;border-radius:20px;border:1px solid #6495ed;color:#6495ed;background:#fff;cursor:pointer;font-size:0.9em">もう一度再生</button>
</div>

<style>
#splash{transition:opacity 0.15s ease}
#splash.hide{opacity:0;pointer-events:none}
@keyframes bar-progress{0%{width:0}100%{width:100%}}
</style>

<script>
function startSplash(fixed) {
  var s = document.getElementById('splash');
  var bar = document.getElementById('bar');
  s.style.display = 'flex';
  s.classList.remove('hide');
  bar.style.animation = 'none';
  bar.offsetHeight;
  bar.style.animation = 'bar-progress 5s linear forwards';

  var done = false;
  function hideSplash() {
    if (done) return;
    done = true;
    s.classList.add('hide');
    setTimeout(function(){ s.style.display='none'; }, 150);
  }

  if (fixed) {
    // 再生ボタン：5秒固定
    setTimeout(hideSplash, 5000);
  } else {
    // 初回：画像読み込み完了で切り替え（上限5秒）
    var timer = setTimeout(hideSplash, 5000);
    var imgs = document.querySelectorAll('img');
    var loaded = 0;
    function onLoad() {
      loaded++;
      if (loaded >= imgs.length) { clearTimeout(timer); hideSplash(); }
    }
    imgs.forEach(function(img) {
      if (img.complete) onLoad();
      else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
    });
  }
}

function replay() {
  startSplash(true);
}

startSplash();
</script>
</body>
</html>
