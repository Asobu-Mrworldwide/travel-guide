<title>お問い合わせ｜World Mappy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#6495ed;--bg:#f5f7f5;--text:#1a1a1a;--sub:#555;
}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:16px}

.hero{
  background:linear-gradient(160deg,#3a6bc4 0%,#6495ed 100%);
  padding:28px 20px 20px;color:#fff;
}
.hero h1{font-size:1.4em;font-weight:900;letter-spacing:1px}
.hero p{font-size:0.85em;opacity:0.85;margin-top:6px}

.back-link{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:0.82em;opacity:0.8;text-decoration:none;margin-bottom:12px}
.back-link:hover{opacity:1}

.container{max-width:860px;margin:0 auto;padding:20px 16px 60px}

.section{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.07);margin-bottom:16px}
.section-title{font-size:0.95em;font-weight:900;color:var(--green);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e8eef8}
.section p{font-size:0.88em;color:var(--sub);line-height:1.9;margin-bottom:10px}
.section p:last-child{margin-bottom:0}

.notice{background:#f8f9fb;border-left:4px solid #6495ed;border-radius:8px;padding:12px 14px;font-size:0.84em;color:#444;line-height:1.8;margin-bottom:16px}

.form-wrap{width:100%;overflow:hidden;border-radius:10px}
.form-wrap iframe{width:100%;border:none;display:block}

@media(max-width:520px){
  .hero h1{font-size:1.2em}
  .section{padding:16px}
}
</style>
</head>
<body>

<div class="hero">
  <a class="back-link" href="../index.html" onclick="if(history.length>1){history.back();return false;}">← 前のページに戻る</a>
  <h1>お問い合わせ</h1>
  <p>内容の誤りやご意見はお気軽にどうぞ</p>
</div>

<div class="container">

  <div class="section">
    <div class="section-title">お問い合わせについて</div>
    <p>当サイトの内容に関するご意見・誤情報のご指摘・その他お問い合わせはこちらからお気軽にどうぞ。旅行情報は随時更新を心がけていますが、現地の状況と異なる場合もございます。気になる点があればお知らせいただけると助かります。</p>
    <p>内容を確認のうえ、順次対応いたします。返信をお約束するものではございませんのでご了承ください。</p>
  </div>

  <div class="section">
    <div class="section-title">お問い合わせフォーム</div>
    <div class="notice">個人情報はお問い合わせへの対応以外の目的には使用しません。</div>
    <div class="form-wrap">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfCg0R5JT9fgQlhsJFduS4qlNjhLH7vhcjk1zbT5_ub6KRyLA/viewform?embedded=true" height="600" loading="lazy">読み込んでいます…</iframe>
    </div>
  </div>

</div>
</body>
