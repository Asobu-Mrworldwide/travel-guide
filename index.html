<title>World Mappy - 世界の旅行ガイド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1d9074;--primary-dark:#15735b;--bg:#E5EDE9;--card:#fff;--text:#1a1a1a;--sub:#555555;--border:#e4eaf5}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium',YuGothic,Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:17px;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ヘッダー */
.site-header{background:var(--primary-dark);padding:13px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.15);position:sticky;top:0;z-index:1000;transition:transform 0.3s ease}
.site-header.header-hidden{transform:translateY(-100%)}
.site-logo{font-size:1.3em;font-weight:900;color:#fff;letter-spacing:-0.5px}
.site-logo span{color:#ffc200}
.site-tagline{font-size:0.75em;color:rgba(255,255,255,0.65);margin-left:auto}

/* ヒーロー */
.hero{background:url('素材/ヒーロー画像_top2.png') center/100% auto no-repeat;aspect-ratio:2928/352;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;position:relative;padding:0 20px}
.hero::before{content:'';position:absolute;inset:0;background:rgba(10,30,60,0.45)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:1.8em;font-weight:900;margin-bottom:8px}
.hero h1 span{color:#ffc200}
.hero p{font-size:0.9em;opacity:0.9;line-height:1.6;max-width:500px;margin:0 auto}

/* フィルターバー */
.filter-bar{background:#E5EDE9;border-bottom:1px solid var(--border);padding:12px 16px;box-shadow:none}
.filter-section{max-width:1200px;margin:0 auto}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0}
.filter-row:last-child{border-bottom:none;padding-bottom:0}
.filter-label{font-size:0.7em;font-weight:700;color:#aaa;white-space:nowrap;width:90px;flex-shrink:0;letter-spacing:0.04em}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;align-items:center}
.chip-divider{width:1px;background:#e5e7eb;align-self:stretch;margin:0 2px;flex-shrink:0}
.chip{padding:4px 11px;border-radius:6px;border:none;background:#f3f4f6;color:#444;font-size:0.75em;cursor:pointer;transition:all 0.15s;white-space:nowrap;user-select:none;font-weight:600}
.chip:hover{background:#e2e5ea;color:#111}
.chip.active{background:var(--primary);color:#fff}
.chip.current-month{outline:2px solid var(--primary);outline-offset:-2px;color:var(--primary)}
.chip.current-month.active{background:var(--primary);color:#fff;outline:none}
.reset-btn{flex-shrink:0;font-size:0.72em;font-weight:700;color:#888;cursor:pointer;border:1.5px solid #ddd;background:#fff;padding:5px 12px;border-radius:20px;white-space:nowrap}
.reset-btn:hover{color:var(--primary);border-color:var(--primary);background:#eef3fd}

/* モバイル用トグルボタン */
.filter-toggle-row{display:none;align-items:center;gap:8px}
.filter-toggle-btn{display:flex;align-items:center;gap:6px;background:var(--primary-dark);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:0.82em;font-weight:700;cursor:pointer;flex:1;justify-content:center}
.filter-toggle-btn .arrow{transition:transform 0.2s;font-style:normal}
.filter-toggle-btn.open .arrow{transform:rotate(180deg)}
.filter-panel{overflow:hidden;transition:max-height 0.3s ease,opacity 0.3s ease}
.filter-panel.closed{max-height:0;opacity:0;pointer-events:none}

/* メインコンテンツ */
.main{max-width:1200px;margin:0 auto;padding:24px 20px}
.results-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.results-info{font-size:0.8em;color:var(--sub)}
.results-info strong{color:var(--primary)}
.view-toggle{display:flex;gap:6px;flex-shrink:0}
.view-toggle button{display:flex;align-items:center;gap:5px;font-size:0.74em;font-weight:700;padding:5px 12px;border:1px solid #d4dbe8;background:#fff;color:#777;border-radius:6px;cursor:pointer;transition:all 0.15s}
.view-toggle button:hover{border-color:var(--primary)}
.view-toggle button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.view-toggle svg{width:14px;height:14px}
@media(max-width:520px){.view-toggle button span{display:none}.view-toggle button{padding:6px 10px}}

/* 国カードグリッド */
.country-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.country-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.country-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.country-grid{grid-template-columns:1fr}}

/* コンパクト表示 */
.country-grid.view-compact{grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:900px){.country-grid.view-compact{grid-template-columns:repeat(4,1fr)}}
@media(max-width:620px){.country-grid.view-compact{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){.country-grid.view-compact{grid-template-columns:repeat(2,1fr)}}
.country-grid.view-compact .card-hero{height:88px}
.country-grid.view-compact .card-catch,.country-grid.view-compact .card-meta{display:none}
.country-grid.view-compact .card-body{padding:8px 10px 8px}
.country-grid.view-compact .card-name{font-size:0.85em}

/* リスト表示 */
.country-grid.view-list{grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.country-grid.view-list{grid-template-columns:1fr}}
.country-grid.view-list .country-card{display:flex}
.country-grid.view-list .card-hero{width:130px;height:auto;min-height:96px;flex-shrink:0}
.country-grid.view-list .card-body{flex:1;min-width:0;padding:10px 14px}
.country-grid.view-list .card-catch{-webkit-line-clamp:2}

/* 国カード */
.country-card{background:var(--card);border-radius:6px;overflow:hidden;border:1px solid var(--border);box-shadow:none;transition:transform 0.18s,border-color 0.18s;cursor:pointer}
.country-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.country-card.unavailable{opacity:0.7;cursor:default}
.country-card.unavailable:hover{transform:none;border-color:var(--border)}
.card-hero{height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-flag{font-size:2.8em;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.card-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.4);color:#fff;font-size:0.65em;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px)}
.card-badge.ready{background:rgba(100,149,237,0.9)}
.card-body{padding:12px 14px 4px}
.card-name{font-size:1em;font-weight:900;color:#111;margin-bottom:2px}
.card-catch{font-size:0.72em;color:var(--sub);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-meta-item{display:flex;align-items:center;gap:3px;font-size:0.68em;color:#555}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0}
.card-tag{background:#eef3fd;color:var(--primary-dark);padding:2px 7px;border-radius:8px;font-size:0.65em;font-weight:600}

/* 空状態 */
.empty-state{text-align:center;padding:60px 20px;color:var(--sub)}
.empty-state .ico{font-size:3em;margin-bottom:12px}
.empty-state p{font-size:0.9em;line-height:1.6}

/* 国一覧リンクセクション */
.country-links{background:#6B5E62;border-top:1px solid var(--border);padding:32px 20px;margin-bottom:0}
.country-links-inner{max-width:1200px;margin:0 auto}
.cl-section{margin-bottom:22px}
.cl-section:last-child{margin-bottom:0}
.cl-section-title{font-size:0.78em;font-weight:700;color:rgba(255,255,255,0.6);letter-spacing:0.04em;margin:0 0 10px;text-align:center}
.cl-chip-row{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center}
.cl-chip{font-size:0.8em;color:rgba(255,255,255,0.9);text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,0.25);border-radius:20px;white-space:nowrap}
.cl-chip:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.5)}
.cl-bottom{margin-top:26px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}
.cl-bottom-group{display:flex;align-items:center;gap:12px}
.cl-bottom-label{font-size:0.75em;color:rgba(255,255,255,0.55);font-weight:700}
.cl-social-icons{display:flex;gap:10px}
.cl-social-icon{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;transition:background 0.15s,border-color 0.15s}
.cl-social-icon:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.6)}
.cl-divider-v{width:1px;height:34px;background:rgba(255,255,255,0.18)}
.cl-copy-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:22px;font-size:0.8em;font-weight:700;background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.35);cursor:pointer;transition:background 0.15s,border-color 0.15s}
.cl-copy-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.6)}
@media(max-width:520px){
  .cl-bottom{gap:18px}
  .cl-divider-v{display:none}
}

/* フッター */
.site-footer{text-align:center;padding:36px 20px;color:rgba(255,255,255,0.6);font-size:0.75em;border-top:1px solid rgba(255,255,255,0.15);margin-top:0;background:#6B5E62}

@media(max-width:520px){
  .hero{aspect-ratio:unset;min-height:160px;padding:36px 16px;background-image:url('素材/ヒーロー画像41_top for スマホ.png');background-size:cover;background-position:center}
  .hero h1{font-size:1.3em}
  .hero p{font-size:0.82em}
  .filter-bar{padding:8px 12px;top:45px}
  .filter-toggle-row{display:flex}
  .filter-panel{margin-top:8px}
  .filter-panel.closed{margin-top:0}
  .filter-row{gap:5px;margin-bottom:6px}
  .filter-label{font-size:0.68em;min-width:unset}
  .filter-chips{gap:4px}
  .chip{padding:3px 9px;font-size:0.72em}
  #pcResetBtn{display:none}
  .site-header{padding:10px 14px}
  .site-logo{font-size:1.1em}
  .site-tagline{font-size:0.7em}
  .main{padding:14px 12px}
  .card-body{padding:10px 12px 4px}
  .card-hero{height:120px}
  .card-flag{font-size:2.3em}
}
</style>
</head>

<style>
#splash{position:fixed;inset:0;background:#2d6a4f;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.15s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
.earth{display:flex;flex-direction:column;align-items:center;text-align:center}
.earth p{color:#fff;display:block;text-align:center;padding-top:0.5em;font-size:1em;font-weight:700;font-family:'Noto Sans JP','Hiragino Sans',sans-serif}
.earth-loader{--watercolor:#3344c1;width:7.5em;height:7.5em;background-color:var(--watercolor);position:relative;overflow:hidden;border-radius:50%;box-shadow:inset 0em 0.5em rgb(255,255,255,0.25),inset 0em -0.5em rgb(0,0,0,0.25);border:solid 0.15em white}
.earth-loader svg:nth-child(1){position:absolute;bottom:-2em;width:7em;height:auto;animation:round1 5s infinite linear 0.75s}
.earth-loader svg:nth-child(2){position:absolute;top:-3em;width:7em;height:auto;animation:round1 5s infinite linear}
.earth-loader svg:nth-child(3){position:absolute;top:-2.5em;width:7em;height:auto;animation:round2 5s infinite linear}
.earth-loader svg:nth-child(4){position:absolute;bottom:-2.2em;width:7em;height:auto;animation:round2 5s infinite linear 0.75s}
@keyframes round1{0%{left:-2em;opacity:100%;transform:skewX(0deg) rotate(0deg)}30%{left:-6em;opacity:100%;transform:skewX(-25deg) rotate(25deg)}31%{left:-6em;opacity:0%;transform:skewX(-25deg) rotate(25deg)}35%{left:7em;opacity:0%;transform:skewX(25deg) rotate(-25deg)}45%{left:7em;opacity:100%;transform:skewX(25deg) rotate(-25deg)}100%{left:-2em;opacity:100%;transform:skewX(0deg) rotate(0deg)}}
@keyframes round2{0%{left:5em;opacity:100%;transform:skewX(0deg) rotate(0deg)}75%{left:-7em;opacity:100%;transform:skewX(-25deg) rotate(25deg)}76%{left:-7em;opacity:0%;transform:skewX(-25deg) rotate(25deg)}77%{left:8em;opacity:0%;transform:skewX(25deg) rotate(-25deg)}80%{left:8em;opacity:100%;transform:skewX(25deg) rotate(-25deg)}100%{left:5em;opacity:100%;transform:skewX(0deg) rotate(0deg)}}
</style>
<script>
(function() {
  var s = document.getElementById('splash');
  if (sessionStorage.getItem('splashShown')) {
    if (s) s.style.display = 'none';
    return;
  }
  sessionStorage.setItem('splashShown', '1');
  setTimeout(function() {
    if (s) s.style.display = 'none';
  }, 1500);
})();
</script>

let selectedMonths = [];
let selectedBudgets = [];
let selectedTags = [];
let selectedRegions = [];
let selectedFlights = [];

const FLIGHT_BUCKETS = {
  f5:  h => h <= 5,
  f10: h => h > 5 && h <= 10,
  f15: h => h > 10 && h <= 15,
  f99: h => h > 15,
};

const HOLIDAYS = [
  { label: '正月', months: [0] },
  { label: 'GW', months: [3, 4] },
  { label: 'お盆', months: [7] },
  { label: 'シルバーウィーク', months: [8] },
];

// 月チップを生成
function buildMonthChips() {
  const container = document.getElementById('monthChips');
  MONTHS.forEach((m, i) => {
    const span = document.createElement('span');
    span.className = 'chip' + (i === NOW_MONTH ? ' current-month' : '');
    span.id = 'month-' + i;
    span.textContent = m;
    span.onclick = () => toggleMonth(i);
    container.appendChild(span);
  });

  // 区切り線
  const divider = document.createElement('span');
  divider.className = 'chip-divider';
  container.appendChild(divider);

  // 祝日チップ
  HOLIDAYS.forEach(h => {
    const span = document.createElement('span');
    span.className = 'chip';
    span.id = 'holiday-' + h.label;
    span.textContent = h.label;
    span.onclick = () => toggleHoliday(h);
    container.appendChild(span);
  });
}

function toggleMonth(i) {
  const idx = selectedMonths.indexOf(i);
  if (idx >= 0) selectedMonths.splice(idx, 1);
  else selectedMonths.push(i);
  document.getElementById('month-' + i).classList.toggle('active');
  // 祝日チップの状態を同期
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

function toggleHoliday(h) {
  const chip = document.getElementById('holiday-' + h.label);
  const isActive = chip.classList.contains('active');
  h.months.forEach(m => {
    const idx = selectedMonths.indexOf(m);
    if (isActive) {
      if (idx >= 0) selectedMonths.splice(idx, 1);
    } else {
      if (idx < 0) selectedMonths.push(m);
    }
    const monthChip = document.getElementById('month-' + m);
    if (monthChip) monthChip.classList.toggle('active', !isActive);
  });
  chip.classList.toggle('active');
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

// 祝日チップのactive状態を月の選択に合わせて同期
function syncHolidayChips() {
  HOLIDAYS.forEach(h => {
    const chip = document.getElementById('holiday-' + h.label);
    if (!chip) return;
    const allSelected = h.months.every(m => selectedMonths.includes(m));
    chip.classList.toggle('active', allSelected);
  });
}

function updateFilterBadge() {}

function toggleBudget(val) {
  const idx = selectedBudgets.indexOf(val);
  if (idx >= 0) selectedBudgets.splice(idx, 1);
  else selectedBudgets.push(val);
  document.getElementById('b-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function toggleTag(val) {
  const idx = selectedTags.indexOf(val);
  if (idx >= 0) selectedTags.splice(idx, 1);
  else selectedTags.push(val);
  document.getElementById('t-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function toggleRegion(val) {
  const idx = selectedRegions.indexOf(val);
  if (idx >= 0) selectedRegions.splice(idx, 1);
  else selectedRegions.push(val);
  document.getElementById('r-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function toggleFlight(val) {
  const idx = selectedFlights.indexOf(val);
  if (idx >= 0) selectedFlights.splice(idx, 1);
  else selectedFlights.push(val);
  document.getElementById('f-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function resetAll() {
  selectedMonths = [];
  selectedBudgets = [];
  selectedTags = [];
  selectedRegions = [];
  selectedFlights = [];
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

function toggleFilterPanel() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggleBtn');
  const isOpen = !panel.classList.contains('closed');
  if (isOpen) {
    panel.style.maxHeight = panel.scrollHeight + 'px';
    requestAnimationFrame(() => {
      panel.style.maxHeight = '0';
      panel.style.opacity = '0';
    });
    panel.classList.add('closed');
    btn.classList.remove('open');
  } else {
    panel.classList.remove('closed');
    panel.style.maxHeight = panel.scrollHeight + 'px';
    panel.style.opacity = '1';
    btn.classList.add('open');
    setTimeout(() => { panel.style.maxHeight = 'none'; }, 300);
  }
}

// 初期化：モバイルでパネルを閉じた状態にする + URLパラメータ読み込み
window.addEventListener('DOMContentLoaded', () => {
  if (window.innerWidth <= 520) {
    const panel = document.getElementById('filterPanel');
    panel.style.maxHeight = '0';
    panel.style.opacity = '0';
    panel.classList.add('closed');
  }
  // ?region=xxx でエリアフィルターを自動適用
  const params = new URLSearchParams(location.search);
  const region = params.get('region');
  if (region && document.getElementById('r-' + region)) {
    selectedRegions.push(region);
    document.getElementById('r-' + region).classList.add('active');
    renderCards();
  }
});

function matchesFilters(c) {
  if (selectedMonths.length > 0 && !selectedMonths.some(m => c.bestMonths.includes(m))) return false;
  if (selectedBudgets.length > 0 && !selectedBudgets.some(b => c.budget.includes(b))) return false;
  if (selectedTags.length > 0 && !selectedTags.every(t => c.tags.includes(t))) return false;
  if (selectedRegions.length > 0 && !selectedRegions.includes(c.region)) return false;
  if (selectedFlights.length > 0) {
    if (typeof c.flightHours !== 'number') return false;
    if (!selectedFlights.some(f => FLIGHT_BUCKETS[f](c.flightHours))) return false;
  }
  return true;
}

function budgetLabel(budget) {
  const icons = {budget1:'格安', budget2:'中級', budget3:'高級'};
  return '⚖️ ' + budget.map(b => icons[b]).join(' / ');
}

function renderCards() {
  const grid = document.getElementById('countryGrid');
  const info = document.getElementById('resultsInfo');
  const filtered = COUNTRIES.filter(matchesFilters);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="ico">🔍</div><p>条件に合う旅先が見つかりませんでした。<br>フィルターを変更してみてください。</p></div>';
    info.innerHTML = '';
    return;
  }

  const availableCount = filtered.filter(c => c.available).length;
  const hasFilter = selectedMonths.length > 0 || selectedBudgets.length > 0 || selectedTags.length > 0;
  info.innerHTML = hasFilter
    ? `<strong>${filtered.length}件</strong>の旅先が見つかりました`
    : `<strong>${availableCount}カ国</strong>を公開中`;

  grid.innerHTML = filtered.map(c => {
    const tagHtml = c.tags.slice(0,4).map(t => `<span class="card-tag">${t}</span>`).join('');
    const cardClass = c.available ? 'country-card' : 'country-card unavailable';
    const badgeHtml = c.available
      ? '<span class="card-badge ready">公開中</span>'
      : '<span class="card-badge">準備中</span>';
    return `
    <div class="${cardClass}" onclick="${c.available ? `location.href='${c.url}'` : 'void(0)'}">
      <div class="card-hero" style="${c.cardImg ? `background:url('${c.cardImg}') center/cover no-repeat` : `background:#cdd0d9`}">
        ${c.cardImg ? '' : `<div class="card-flag">${c.flag}</div>`}
        ${badgeHtml}
      </div>
      <div class="card-body">
        <div class="card-name">${c.name}</div>
        <div class="card-catch">${c.catch}</div>
        <div class="card-meta">
          <span class="card-meta-item">✈️ ${c.flight}</span>
          <span class="card-meta-item">🌤️ ${c.bestLabel}</span>
          <span class="card-meta-item">${budgetLabel(c.budget)}</span>
        </div>
        <div class="card-tags">${tagHtml}</div>
      </div>
    </div>`;
  }).join('');
}

let currentView = localStorage.getItem('countryView') || 'standard';
function setView(view) {
  currentView = view;
  localStorage.setItem('countryView', view);
  const grid = document.getElementById('countryGrid');
  grid.classList.remove('view-compact', 'view-list');
  if (view === 'compact') grid.classList.add('view-compact');
  else if (view === 'list') grid.classList.add('view-list');
  document.querySelectorAll('#viewToggle button').forEach(b => {
    b.classList.toggle('on', b.dataset.view === view);
  });
}

buildMonthChips();
renderCards();
setView(currentView);

/* ヘッダー: 下スクロールで隠す・上スクロールで表示 */
(function(){
  const header = document.querySelector('.site-header');
  if (!header) return;
  let lastY = window.scrollY;
  window.addEventListener('scroll', function(){
    const y = window.scrollY;
    if (y > lastY && y > 80) { header.classList.add('header-hidden'); }
    else { header.classList.remove('header-hidden'); }
    lastY = y;
  }, { passive: true });
})();
