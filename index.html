<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#6495ed;--primary-dark:#4a7be0;--bg:#ffffff;--card:#fff;--text:#1a1a1a;--sub:#555555;--border:#e4eaf5}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium',YuGothic,Meiryo,sans-serif;background:var(--bg);color:var(--text);font-size:17px;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ヘッダー */
.site-header{background:var(--primary-dark);padding:13px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.site-logo{font-size:1.3em;font-weight:900;color:#fff;letter-spacing:-0.5px}
.site-logo span{color:#ffc200}
.site-tagline{font-size:0.75em;color:rgba(255,255,255,0.65);margin-left:auto}

/* ヒーロー */
.hero{background:url('素材/ヒーロー画像_top2.png') center/100% auto no-repeat;aspect-ratio:2928/352;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;position:relative;padding:0 20px}
.hero::before{content:'';position:absolute;inset:0;background:rgba(10,30,60,0.45)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:1.8em;font-weight:900;margin-bottom:8px}
.hero h1 span{color:#ffc200}
.hero p{font-size:0.9em;opacity:0.9;line-height:1.6;max-width:500px;margin:0 auto}

/* フィルターバー */
.filter-bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;box-shadow:none}
.filter-section{max-width:1200px;margin:0 auto}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f0}
.filter-row:last-child{border-bottom:none;padding-bottom:0}
.filter-label{font-size:0.7em;font-weight:700;color:#aaa;white-space:nowrap;width:90px;flex-shrink:0;letter-spacing:0.04em}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;align-items:center}
.chip-divider{width:1px;background:#e5e7eb;align-self:stretch;margin:0 2px;flex-shrink:0}
.chip{padding:4px 11px;border-radius:6px;border:none;background:#f3f4f6;color:#444;font-size:0.75em;cursor:pointer;transition:all 0.15s;white-space:nowrap;user-select:none;font-weight:600}
.chip:hover{background:#e2e5ea;color:#111}
.chip.active{background:var(--primary);color:#fff}
.chip.current-month{outline:2px solid var(--primary);outline-offset:-2px;color:var(--primary)}
.chip.current-month.active{background:var(--primary);color:#fff;outline:none}
.reset-btn{flex-shrink:0;font-size:0.72em;font-weight:700;color:#888;cursor:pointer;border:1.5px solid #ddd;background:#fff;padding:5px 12px;border-radius:20px;white-space:nowrap}
.reset-btn:hover{color:var(--primary);border-color:var(--primary);background:#eef3fd}

/* モバイル用トグルボタン */
.filter-toggle-row{display:none;align-items:center;gap:8px}
.filter-toggle-btn{display:flex;align-items:center;gap:6px;background:var(--primary-dark);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:0.82em;font-weight:700;cursor:pointer;flex:1;justify-content:center}
.filter-toggle-btn .arrow{transition:transform 0.2s;font-style:normal}
.filter-toggle-btn.open .arrow{transform:rotate(180deg)}
.filter-panel{overflow:hidden;transition:max-height 0.3s ease,opacity 0.3s ease}
.filter-panel.closed{max-height:0;opacity:0;pointer-events:none}

/* メインコンテンツ */
.main{max-width:1200px;margin:0 auto;padding:24px 20px}
.results-info{font-size:0.8em;color:var(--sub);margin-bottom:14px}
.results-info strong{color:var(--primary)}

/* 国カードグリッド */
.country-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.country-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.country-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.country-grid{grid-template-columns:1fr}}

/* 国カード */
.country-card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:none;transition:transform 0.18s,border-color 0.18s;cursor:pointer}
.country-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.country-card.unavailable{opacity:0.7;cursor:default}
.country-card.unavailable:hover{transform:none;border-color:var(--border)}
.card-hero{height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-flag{font-size:2.8em;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.card-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.4);color:#fff;font-size:0.65em;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px)}
.card-badge.ready{background:rgba(100,149,237,0.9)}
.card-body{padding:12px 14px 4px}
.card-name{font-size:1em;font-weight:900;color:#111;margin-bottom:2px}
.card-catch{font-size:0.72em;color:var(--sub);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-meta-item{display:flex;align-items:center;gap:3px;font-size:0.68em;color:#555}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:0}
.card-tag{background:#eef3fd;color:var(--primary-dark);padding:2px 7px;border-radius:8px;font-size:0.65em;font-weight:600}

/* 空状態 */
.empty-state{text-align:center;padding:60px 20px;color:var(--sub)}
.empty-state .ico{font-size:3em;margin-bottom:12px}
.empty-state p{font-size:0.9em;line-height:1.6}

/* 国一覧リンクセクション */
.country-links{background:#f6f4ef;border-top:1px solid var(--border);padding:32px 20px;margin-bottom:0}
.country-links-inner{max-width:1200px;margin:0 auto}
.cl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 32px}
.cl-col ul{list-style:none;margin:0;padding:0}
.cl-col li{font-size:0.78em;padding:3px 0;line-height:1.5}
.cl-region{font-size:0.7em;font-weight:700;color:#888;letter-spacing:0.06em;margin:0 0 8px}
.cl-col a{color:#555;text-decoration:none}
.cl-col a:hover{color:var(--primary);text-decoration:underline}
.cl-unavailable{color:#bbb}
.cl-mobile{display:none}
@media(max-width:900px){.cl-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){
  .cl-grid{display:none}
  .cl-mobile{display:flex;flex-wrap:wrap;gap:8px}
  .cl-region-link{font-size:0.8em;color:#555;text-decoration:none;padding:4px 12px;border:1px solid var(--border);border-radius:20px;background:#fff}
}

/* フッター */
.site-footer{text-align:center;padding:36px 20px;color:var(--sub);font-size:0.75em;border-top:1px solid var(--border);margin-top:0}

@media(max-width:520px){
  .hero{aspect-ratio:unset;min-height:160px;padding:36px 16px;background-image:url('素材/ヒーロー画像41_top for スマホ.png');background-size:cover;background-position:center}
  .hero h1{font-size:1.3em}
  .hero p{font-size:0.82em}
  .filter-bar{padding:8px 12px;top:45px}
  .filter-toggle-row{display:flex}
  .filter-panel{margin-top:8px}
  .filter-panel.closed{margin-top:0}
  .filter-row{gap:5px;margin-bottom:6px}
  .filter-label{font-size:0.68em;min-width:unset}
  .filter-chips{gap:4px}
  .chip{padding:3px 9px;font-size:0.72em}
  #pcResetBtn{display:none}
  .site-header{padding:10px 14px}
  .site-logo{font-size:1.1em}
  .site-tagline{font-size:0.7em}
  .main{padding:14px 12px}
  .card-body{padding:10px 12px 4px}
  .card-hero{height:120px}
  .card-flag{font-size:2.3em}

</style>

@keyframes splash-progress{0%{width:0}100%{width:100%}}
</style>
<script>
(function() {
  var start = Date.now();
  var MIN = 2000;
  function hideSplash() {
    var s = document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(function(){ s.style.display='none'; }, 600);
  }
  window.addEventListener('load', function() {
    var elapsed = Date.now() - start;
    var remaining = Math.max(0, MIN - elapsed);
    setTimeout(hideSplash, remaining);
  });
})();
</script>

    gradient:'linear-gradient(135deg,#003580 0%,#cc0001 100%)',
    url:'#', available:false
  },
  {
    name:'ハワイ（アメリカ）', nameEn:'Hawaii', flag:'🇺🇸',
    catch:'常夏のビーチ・ロコモコ・火山。日本人に最も愛されるリゾート',
    region:'北アメリカ', flight:'約7〜8時間', budget:['budget2','budget3'],
    bestMonths:[3,4,5,6,7,8,9,10], bestLabel:'4〜11月',
    tags:['ビーチ','リゾート','自然','アウトドア'],
    gradient:'linear-gradient(135deg,#003580 0%,#e8490f 100%)',
    url:'#', available:false
  },
];

let selectedMonths = [];
let selectedBudgets = [];
let selectedTags = [];
let selectedRegions = [];

const HOLIDAYS = [
  { label: '正月', months: [0] },
  { label: 'GW', months: [3, 4] },
  { label: 'お盆', months: [7] },
  { label: 'シルバーウィーク', months: [8] },
];

// 月チップを生成
function buildMonthChips() {
  const container = document.getElementById('monthChips');
  MONTHS.forEach((m, i) => {
    const span = document.createElement('span');
    span.className = 'chip' + (i === NOW_MONTH ? ' current-month' : '');
    span.id = 'month-' + i;
    span.textContent = m;
    span.onclick = () => toggleMonth(i);
    container.appendChild(span);
  });

  // 区切り線
  const divider = document.createElement('span');
  divider.className = 'chip-divider';
  container.appendChild(divider);

  // 祝日チップ
  HOLIDAYS.forEach(h => {
    const span = document.createElement('span');
    span.className = 'chip';
    span.id = 'holiday-' + h.label;
    span.textContent = h.label;
    span.onclick = () => toggleHoliday(h);
    container.appendChild(span);
  });
}

function toggleMonth(i) {
  const idx = selectedMonths.indexOf(i);
  if (idx >= 0) selectedMonths.splice(idx, 1);
  else selectedMonths.push(i);
  document.getElementById('month-' + i).classList.toggle('active');
  // 祝日チップの状態を同期
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

function toggleHoliday(h) {
  const chip = document.getElementById('holiday-' + h.label);
  const isActive = chip.classList.contains('active');
  h.months.forEach(m => {
    const idx = selectedMonths.indexOf(m);
    if (isActive) {
      if (idx >= 0) selectedMonths.splice(idx, 1);
    } else {
      if (idx < 0) selectedMonths.push(m);
    }
    const monthChip = document.getElementById('month-' + m);
    if (monthChip) monthChip.classList.toggle('active', !isActive);
  });
  chip.classList.toggle('active');
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

// 祝日チップのactive状態を月の選択に合わせて同期
function syncHolidayChips() {
  HOLIDAYS.forEach(h => {
    const chip = document.getElementById('holiday-' + h.label);
    if (!chip) return;
    const allSelected = h.months.every(m => selectedMonths.includes(m));
    chip.classList.toggle('active', allSelected);
  });
}

function updateFilterBadge() {}

function toggleBudget(val) {
  const idx = selectedBudgets.indexOf(val);
  if (idx >= 0) selectedBudgets.splice(idx, 1);
  else selectedBudgets.push(val);
  document.getElementById('b-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function toggleTag(val) {
  const idx = selectedTags.indexOf(val);
  if (idx >= 0) selectedTags.splice(idx, 1);
  else selectedTags.push(val);
  document.getElementById('t-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function toggleRegion(val) {
  const idx = selectedRegions.indexOf(val);
  if (idx >= 0) selectedRegions.splice(idx, 1);
  else selectedRegions.push(val);
  document.getElementById('r-' + val).classList.toggle('active');
  renderCards();
  updateFilterBadge();
}

function resetAll() {
  selectedMonths = [];
  selectedBudgets = [];
  selectedTags = [];
  selectedRegions = [];
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  syncHolidayChips();
  renderCards();
  updateFilterBadge();
}

function toggleFilterPanel() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggleBtn');
  const isOpen = !panel.classList.contains('closed');
  if (isOpen) {
    panel.style.maxHeight = panel.scrollHeight + 'px';
    requestAnimationFrame(() => {
      panel.style.maxHeight = '0';
      panel.style.opacity = '0';
    });
    panel.classList.add('closed');
    btn.classList.remove('open');
  } else {
    panel.classList.remove('closed');
    panel.style.maxHeight = panel.scrollHeight + 'px';
    panel.style.opacity = '1';
    btn.classList.add('open');
    setTimeout(() => { panel.style.maxHeight = 'none'; }, 300);
  }
}

// 初期化：モバイルでパネルを閉じた状態にする + URLパラメータ読み込み
window.addEventListener('DOMContentLoaded', () => {
  if (window.innerWidth <= 520) {
    const panel = document.getElementById('filterPanel');
    panel.style.maxHeight = '0';
    panel.style.opacity = '0';
    panel.classList.add('closed');
  }
  // ?region=xxx でエリアフィルターを自動適用
  const params = new URLSearchParams(location.search);
  const region = params.get('region');
  if (region && document.getElementById('r-' + region)) {
    selectedRegions.push(region);
    document.getElementById('r-' + region).classList.add('active');
    renderCards();
  }
});

function matchesFilters(c) {
  if (selectedMonths.length > 0 && !selectedMonths.some(m => c.bestMonths.includes(m))) return false;
  if (selectedBudgets.length > 0 && !selectedBudgets.some(b => c.budget.includes(b))) return false;
  if (selectedTags.length > 0 && !selectedTags.every(t => c.tags.includes(t))) return false;
  if (selectedRegions.length > 0 && !selectedRegions.includes(c.region)) return false;
  return true;
}

function budgetLabel(budget) {
  const icons = {budget1:'格安', budget2:'中級', budget3:'高級'};
  return '⚖️ ' + budget.map(b => icons[b]).join(' / ');
}

function renderCards() {
  const grid = document.getElementById('countryGrid');
  const info = document.getElementById('resultsInfo');
  const filtered = COUNTRIES.filter(matchesFilters);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="ico">🔍</div><p>条件に合う旅先が見つかりませんでした。<br>フィルターを変更してみてください。</p></div>';
    info.innerHTML = '';
    return;
  }

  const hasFilter = selectedMonths.length > 0 || selectedBudgets.length > 0 || selectedTags.length > 0;
  info.innerHTML = hasFilter
    ? `<strong>${filtered.length}件</strong>の旅先が見つかりました`
    : `<strong>${filtered.length}カ国</strong>を掲載中`;

  grid.innerHTML = filtered.map(c => {
    const tagHtml = c.tags.slice(0,4).map(t => `<span class="card-tag">${t}</span>`).join('');
    const cardClass = c.available ? 'country-card' : 'country-card unavailable';
    const badgeHtml = c.available
      ? '<span class="card-badge ready">公開中</span>'
      : '<span class="card-badge">準備中</span>';
    return `
    <div class="${cardClass}" onclick="${c.available ? `location.href='${c.url}'` : 'void(0)'}">
      <div class="card-hero" style="${c.cardImg ? `background:url('${c.cardImg}') center/cover no-repeat` : `background:#cdd0d9`}">
        ${c.cardImg ? '' : `<div class="card-flag">${c.flag}</div>`}
        ${badgeHtml}
      </div>
      <div class="card-body">
        <div class="card-name">${c.name}</div>
        <div class="card-catch">${c.catch}</div>
        <div class="card-meta">
          <span class="card-meta-item">✈️ ${c.flight}</span>
          <span class="card-meta-item">🌤️ ${c.bestLabel}</span>
          <span class="card-meta-item">${budgetLabel(c.budget)}</span>
        </div>
        <div class="card-tags">${tagHtml}</div>
      </div>
    </div>`;
  }).join('');
}

buildMonthChips();
renderCards();
</script>
</body>
</html>
