<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>広告・アフィリエイト管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f4f6f8;color:#222;font-size:14px}

.header{background:#1a3a5c;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:1em;font-weight:900}
.header p{font-size:0.78em;opacity:0.7;margin-top:2px}

.container{max-width:760px;margin:0 auto;padding:24px 16px 60px}

.section-title{font-size:0.72em;font-weight:700;color:#aaa;letter-spacing:0.08em;text-transform:uppercase;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid #e0e4e8}

/* テキストリンクプレビュー */
.link-preview-list{display:flex;flex-direction:column;gap:8px}
.link-preview-item{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.link-preview-key{font-size:0.68em;font-weight:700;color:#aaa;margin-bottom:6px;font-family:monospace}
.link-preview-url{font-size:0.72em;color:#999;margin-top:4px;word-break:break-all}
.link-preview-url.placeholder{color:#e8490f}

/* カードプレビュー */
.cards-list{display:flex;flex-direction:column;gap:12px}
.card-item{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}

/* 共通 budget-link スタイル（プレビュー用） */
.budget-link{display:block;width:100%;text-align:right;font-size:0.75em;font-weight:700;color:#006847;text-decoration:none;margin-top:2px}

.edit-hint{background:#fffbe6;border:1px solid #ffc200;border-radius:8px;padding:12px 14px;font-size:0.8em;color:#665500;line-height:1.7;margin-bottom:20px}
.edit-hint code{background:#fff3cc;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:0.9em}

/* 使用状況サマリー */
.usage-summary{border-radius:8px;padding:12px 14px;font-size:0.8em;line-height:1.8;margin-bottom:20px}
.usage-summary.ok{background:#e8f5ee;color:#0a6b3f;border:1px solid #b8e0c8}
.usage-summary.warn{background:#fdeaea;color:#a01515;border:1px solid #f3c2c2}
.usage-summary .meta{color:#888;font-size:0.85em;display:block;margin-top:4px}

/* 使用状況バッジ */
.usage-box{margin-top:10px;padding-top:10px;border-top:1px dashed #e5e5e5}
.usage-count{display:inline-block;font-size:0.7em;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px}
.usage-count.used{background:#e8f5ee;color:#0a6b3f}
.usage-count.unused{background:#fdeaea;color:#a01515}
.usage-count.auto{background:#fff4e0;color:#8a6300}
.page-chip-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.page-chip{font-size:0.66em;font-family:monospace;background:#f0f2f4;color:#556;padding:2px 7px;border-radius:5px}
.usage-toggle{font-size:0.7em;color:#0770e3;cursor:pointer;margin-top:6px;display:inline-block;user-select:none}
.brand-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.brand-chip{font-size:0.75em;font-weight:700;background:#fff;border:1px solid #d5dbe1;color:#345;padding:4px 10px;border-radius:14px;cursor:pointer;text-decoration:none}
.brand-chip:hover{background:#eaf1f8}
.brand-chip .n{color:#999;font-weight:400;margin-left:4px}
.brand-sec{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:16px;overflow:hidden}
.brand-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#eef3f8;border-bottom:1px solid #e0e4e8}
.brand-head h2{font-size:1em;font-weight:900;color:#1a3a5c}
.brand-head .cat{font-size:0.68em;background:#1a3a5c;color:#fff;padding:2px 8px;border-radius:10px}
.brand-head .cnt{margin-left:auto;font-size:0.72em;color:#778}
.style-block{padding:12px 16px;border-bottom:1px solid #f0f2f4}
.style-block:last-child{border-bottom:none}
.style-label{font-size:0.7em;font-weight:700;color:#fff;background:#8a99a8;display:inline-block;padding:1px 8px;border-radius:4px;margin-bottom:8px}
.style-label.text{background:#0770e3}.style-label.box{background:#e8790f}.style-label.card{background:#00a86b}
</style>
</head>
<body>

<div class="header">
  <h1>📋 広告・アフィリエイト管理</h1>
  <p>affiliates-data.js の内容と、各ページでの使用状況をまとめて確認できます</p>
</div>

<div class="container">

  <div class="edit-hint">
    ✏️ リンク・バナー画像を編集するファイル：<code>assets/affiliates-data.js</code><br>
    追加・変更したら保存 →「使用状況」を最新化するため <code>python assets/tools/audit_affiliates.py</code> を実行 → このページをリロード。
  </div>

  <div id="usageSummary"></div>

  <div class="brand-nav" id="brandNav"></div>
  <div id="brandList"></div>

</div>

<script src="affiliates-data.js"></script>
<script src="affiliates.js"></script>
<script src="affiliate-usage-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

  const usageData = (typeof AFFILIATE_USAGE !== 'undefined') ? AFFILIATE_USAGE : null;

  // ── 使用状況バッジのHTMLを組み立てる ──
  function usageBoxHtml(type, key) {
    if (!usageData) {
      return '<div class="usage-box" style="color:#bbb;font-size:0.72em">使用状況データなし（audit_affiliates.py 未実行）</div>';
    }
    const u = (usageData.usage[type] || {})[key];
    if (!u) return '';

    const chips = (pages, extraClass) => pages.map(p => {
      const short = p.file.replace(/\.html$/, '').replace(/\//g, ' / ');
      return `<span class="page-chip${extraClass ? ' ' + extraClass : ''}">${short}${p.count > 1 ? ' ×' + p.count : ''}</span>`;
    }).join('');

    let html = '<div class="usage-box">';
    if (u.total > 0) {
      html += `<span class="usage-count used">${u.total}箇所で使用</span>`;
    } else if (u.auto_via_text_link && u.auto_pages && u.auto_pages.length) {
      html += `<span class="usage-count auto">テキストリンク経由で自動表示（${u.auto_pages.length}箇所）</span>`;
    } else {
      html += '<span class="usage-count unused">⚠️ どのページからも未使用</span>';
    }

    const allChips = chips(u.pages || []) + (u.auto_via_text_link ? chips(u.auto_pages || [], 'auto-chip') : '');
    if (allChips) {
      const listId = `pages-${type}-${key}`.replace(/[^a-zA-Z0-9_-]/g, '');
      html += `<span class="usage-toggle" onclick="var l=document.getElementById('${listId}');l.style.display=(l.style.display==='none'?'flex':'none');">配置ページを表示/非表示</span>`;
      html += `<div class="page-chip-list" id="${listId}" style="display:none">${allChips}</div>`;
    }
    html += '</div>';
    return html;
  }

  // ── 使用状況サマリー ──
  const summaryEl = document.getElementById('usageSummary');
  if (usageData) {
    const unusedCount = usageData.unused.length;
    const cls = unusedCount > 0 ? 'warn' : 'ok';
    let html = `<div class="usage-summary ${cls}">`;
    html += unusedCount > 0
      ? `⚠️ どのページにも配置されていないキーが ${unusedCount} 件あります`
      : '✅ 定義済みキーは全て何かしらのページで使われています';
    if (unusedCount > 0) {
      html += '<br>' + usageData.unused.map(u => `<code>[${u.type}] ${u.key}</code>`).join('　');
    }
    html += `<span class="meta">走査ファイル数: ${usageData.scanned_files} ／ 集計日時: ${usageData.generated_at}</span>`;
    html += '</div>';
    summaryEl.innerHTML = html;
  } else {
    summaryEl.innerHTML = `<div class="usage-summary warn">使用状況データが見つかりません。<code>python assets/tools/audit_affiliates.py</code> を一度実行してください。</div>`;
  }

  // ── ブランド別に分類して表示 ──
  const BRANDS = [
    ['Klook','現地ツアー',['klook']],['KKday','現地ツアー',['kkday']],
    ['GetYourGuide','現地ツアー',['getyourguide']],['Viator','現地ツアー',['viator']],
    ['Wise','決済・お金',['wise']],['エポスカード','決済・お金',['epos']],
    ['trifa','通信',['trifa']],['Airalo','通信',['airalo']],['モバイルWi-Fi','通信',['wifi1','wifi2']],
    ['Skyscanner','航空券',['skyscanner']],
    ['Grab','配車・地図',['grab']],['Uber','配車・地図',['uber']],['PickMe','配車・地図',['pickme']],
    ['Yandex','配車・地図',['yandex_go','yandex_maps']],['Google','アプリ',['google_maps','google_translate']],
    ['Telegram','アプリ',['telegram']],['WhatsApp','アプリ',['whatsapp']],
    ['比較ページ（汎用）','比較',['flights','hotels','sim','sim_compare']]
  ];
  const STYLES = [
    ['text','テキストリンク',AFFILIATES,k=>`<div class="link-preview-item" style="box-shadow:none;padding:0"><div class="link-preview-key">key: "${k}"</div><span data-affiliate="${k}"></span><div class="link-preview-url">${AFFILIATES[k].url==='#'?'⚠️ URL未設定（#）':'🔗 '+AFFILIATES[k].url}</div>${usageBoxHtml('affiliate',k)}</div>`],
    ['box','予約ボタン',BOOKING_BOXES,k=>`<div class="link-preview-key">key: "${k}"</div><div data-affiliate-box="${k}" ${k==='flights'?'data-dest="bkk"':''}></div>${usageBoxHtml('affiliate-box',k)}`],
    ['card','説明カード',AFFILIATE_CARDS,k=>`<div class="link-preview-key">key: "${k}"</div><div data-affiliate-card="${k}"></div>${usageBoxHtml('affiliate-card',k)}`]
  ];
  const mapped = new Set(BRANDS.flatMap(b => b[2]));
  const others = new Set();
  STYLES.forEach(st => Object.keys(st[2]).forEach(k => { if (!mapped.has(k)) others.add(k); }));
  if (others.size) BRANDS.push(['その他','その他',[...others]]);

  const nav = document.getElementById('brandNav');
  const list = document.getElementById('brandList');
  BRANDS.forEach(([name, cat, keys], i) => {
    let blocks = '', total = 0;
    STYLES.forEach(([cls, label, data, render]) => {
      keys.filter(k => data[k]).forEach(k => {
        total++;
        blocks += `<div class="style-block"><span class="style-label ${cls}">${label}</span>${render(k)}</div>`;
      });
    });
    if (!total) return;
    nav.innerHTML += `<a class="brand-chip" href="#brand-${i}">${name}<span class="n">${total}</span></a>`;
    list.innerHTML += `<div class="brand-sec" id="brand-${i}"><div class="brand-head"><h2>${name}</h2><span class="cat">${cat}</span><span class="cnt">保存スタイル ${total}件</span></div>${blocks}</div>`;
  });

  // 描画実行
  initAffiliates();
});
</script>
</body>
</html>
