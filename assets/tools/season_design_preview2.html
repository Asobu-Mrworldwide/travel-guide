<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>案A 派生デザイン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f0f0f0;padding:24px;color:#333}
h2{font-size:0.78em;color:#888;margin:28px 0 8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.wrap{background:#fff;border-radius:16px;padding:18px 16px 14px;border:1px solid #e8e8e8;margin-bottom:4px}
.city-lbl{font-size:0.78em;font-weight:700;color:#1d9074;margin-bottom:10px}
</style>
</head>
<body>

<script>
const uzb = [
  {mo:'1',icon:'❄️',temp:2,type:'freeze'},
  {mo:'2',icon:'❄️',temp:4,type:'cold'},
  {mo:'3',icon:'⛅',temp:12,type:'cool'},
  {mo:'4',icon:'⛅',temp:19,type:'mild'},
  {mo:'5',icon:'☀️',temp:25,type:'hot1'},
  {mo:'6',icon:'☀️',temp:30,type:'hot2'},
  {mo:'7',icon:'☀️',temp:33,type:'hot2'},
  {mo:'8',icon:'☀️',temp:31,type:'hot2'},
  {mo:'9',icon:'☀️',temp:25,type:'hot1'},
  {mo:'10',icon:'⛅',temp:16,type:'mild'},
  {mo:'11',icon:'🌧️',temp:8,type:'cool'},
  {mo:'12',icon:'❄️',temp:3,type:'freeze'},
];
const bg = {freeze:'#f5ede0',cold:'#f5e4cc',cool:'#f5d8a0',mild:'#f5c870',warm:'#f5b440',hot1:'#f5a020',hot2:'#f07830',hot3:'#e05020'};
const temps = uzb.map(m=>m.temp);
const minT=Math.min(...temps), maxT=Math.max(...temps);
function xOf(i){ return (i/(uzb.length-1))*100; }
function yOf(t){ return 100-((t-minT)/(maxT-minT))*85-5; }
function makePts(){ return uzb.map((m,i)=>`${xOf(i)},${yOf(m.temp)}`).join(' '); }
function makeFill(){ return `0,100 ${makePts()} 100,100`; }
</script>

<!-- A1: グラフ→カード（元案） -->
<h2>A1 — グラフ + カード（元案）</h2>
<div class="wrap" id="a1">
  <div class="city-lbl">タシュケント</div>
  <svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:40px;display:block;margin-bottom:6px">
    <polygon id="a1fill" fill="#fff8ee"/>
    <polyline id="a1line" fill="none" stroke="#f5a020" stroke-width="0.8" stroke-linejoin="round"/>
    <g id="a1dots"></g>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:2px" id="a1row"></div>
</div>

<!-- A2: グラフのみ、温度ラベルをグラフ上に直接表示 -->
<h2>A2 — グラフ上に温度直書き（カードなし）</h2>
<div class="wrap">
  <div class="city-lbl">タシュケント</div>
  <svg viewBox="0 0 100 50" preserveAspectRatio="none" style="width:100%;height:70px;display:block">
    <polygon id="a2fill" fill="#fff8ee"/>
    <polyline id="a2line" fill="none" stroke="#f5a020" stroke-width="0.7" stroke-linejoin="round"/>
    <g id="a2labels"></g>
    <g id="a2mo"></g>
  </svg>
</div>

<!-- A3: セル背景が温度カラー、グラフ重ね -->
<h2>A3 — 温度カラーセル＋グラフオーバーレイ</h2>
<div class="wrap" style="padding:0;overflow:hidden">
  <div style="padding:14px 16px 0;"><div class="city-lbl">タシュケント</div></div>
  <div style="position:relative">
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:0" id="a3cells"></div>
    <svg viewBox="0 0 100 30" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none">
      <polyline id="a3line" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1" stroke-linejoin="round"/>
      <g id="a3dots"></g>
    </svg>
  </div>
</div>

<!-- A4: 大きいアイコン＋グラフ（縦長） -->
<h2>A4 — 大きいアイコン＋グラフ（天気アプリ感強め）</h2>
<div class="wrap">
  <div class="city-lbl">タシュケント</div>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:4px" id="a4icons"></div>
  <svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:28px;display:block;margin-bottom:4px">
    <polygon id="a4fill" fill="#fff8ee"/>
    <polyline id="a4line" fill="none" stroke="#f5a020" stroke-width="0.7" stroke-linejoin="round"/>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:2px" id="a4mo"></div>
</div>

<!-- A5: 丸バッジ型 -->
<h2>A5 — 丸バッジ＋グラフ</h2>
<div class="wrap">
  <div class="city-lbl">タシュケント</div>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;margin-bottom:6px" id="a5top"></div>
  <svg viewBox="0 0 100 12" preserveAspectRatio="none" style="width:100%;height:16px;display:block;margin-bottom:4px">
    <polyline id="a5line" fill="none" stroke="#ddd" stroke-width="0.5" stroke-linejoin="round"/>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px" id="a5mo"></div>
</div>

<!-- A6: グラデーション背景帯＋折れ線 -->
<h2>A6 — グラデーション帯背景</h2>
<div class="wrap" style="background:linear-gradient(to right,#e8f0fa,#fff8ee,#fff0dd,#fef0e8,#fff8ee,#e8f0fa);border:none">
  <div class="city-lbl">タシュケント</div>
  <svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:44px;display:block;margin-bottom:4px">
    <polyline id="a6line" fill="none" stroke="#e88020" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="0"/>
    <g id="a6dots"></g>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(12,1fr)" id="a6row"></div>
</div>

<!-- A7: ミニマル・数字大きめ -->
<h2>A7 — ミニマル・数字主役</h2>
<div class="wrap">
  <div class="city-lbl">タシュケント</div>
  <svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%;height:28px;display:block">
    <polygon id="a7fill" fill="#fef5e8"/>
    <polyline id="a7line" fill="none" stroke="#f5a020" stroke-width="0.6" stroke-linejoin="round"/>
  </svg>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:1px;border-top:2px solid #f5a020" id="a7row"></div>
</div>

<script>
// A1
document.getElementById('a1fill').setAttribute('points',makeFill().replace(/(\d+\.?\d*),(\d+\.?\d*)/g,(m,x,y)=>`${parseFloat(x)}%,${parseFloat(y)*0.28}px`));
(function(){
  const pts = uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.27}`).join(' ');
  const fill = `0 8 ${pts} 100 8`;
  document.getElementById('a1fill').setAttribute('points',fill);
  document.getElementById('a1line').setAttribute('points',pts);
  const g = document.getElementById('a1dots');
  uzb.forEach((m,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',xOf(i));c.setAttribute('cy',yOf(m.temp)*0.27);c.setAttribute('r','1.2');
    c.setAttribute('fill',bg[m.type]||'#f5a020');c.setAttribute('stroke','#f5a020');c.setAttribute('stroke-width','0.5');
    g.appendChild(c);
  });
  const row=document.getElementById('a1row');
  uzb.forEach(m=>{row.innerHTML+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0"><div style="font-size:0.6em;color:#aaa">${m.mo}月</div><div style="font-size:1em">${m.icon}</div><div style="font-size:0.68em;font-weight:700;color:#555">${m.temp}°</div></div>`;});
})();

// A2 グラフ上に直書き
(function(){
  const pts = uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.72+14}`).join(' ');
  const fill = `0 48 ${pts} 100 48`;
  document.getElementById('a2fill').setAttribute('points',fill);
  document.getElementById('a2line').setAttribute('points',pts);
  const gl=document.getElementById('a2labels'), gm=document.getElementById('a2mo');
  uzb.forEach((m,i)=>{
    const x=xOf(i), y=yOf(m.temp)*0.72+14;
    // temp label
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x+'%');t.setAttribute('y',(y-4)+'');t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','3.5');t.setAttribute('font-weight','700');t.setAttribute('fill','#555');
    t.textContent=m.temp+'°';
    gl.appendChild(t);
    // month
    const mo=document.createElementNS('http://www.w3.org/2000/svg','text');
    mo.setAttribute('x',x+'%');mo.setAttribute('y','49');mo.setAttribute('text-anchor','middle');
    mo.setAttribute('font-size','3.2');mo.setAttribute('fill','#aaa');
    mo.textContent=m.mo+'月';
    gm.appendChild(mo);
  });
})();

// A3 カラーセル
(function(){
  const cells=document.getElementById('a3cells');
  uzb.forEach(m=>{
    cells.innerHTML+=`<div style="background:${bg[m.type]||'#f5e4cc'};padding:10px 0 28px;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="font-size:0.58em;font-weight:700;color:rgba(0,0,0,0.4)">${m.mo}月</div><div style="font-size:1em">${m.icon}</div></div>`;
  });
  const pts=uzb.map((m,i)=>`${xOf(i)} ${100-yOf(m.temp)*0.55}`).join(' ');
  document.getElementById('a3line').setAttribute('points',pts);
  const g=document.getElementById('a3dots');
  uzb.forEach((m,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',xOf(i)+'%');c.setAttribute('cy',(100-yOf(m.temp)*0.55)+'%');c.setAttribute('r','1.8');
    c.setAttribute('fill','#fff');c.setAttribute('stroke','rgba(255,255,255,0.7)');c.setAttribute('stroke-width','1');
    g.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',xOf(i)+'%');t.setAttribute('y',(100-yOf(m.temp)*0.55-3)+'%');
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','3.5');t.setAttribute('fill','#fff');t.setAttribute('font-weight','700');
    t.textContent=m.temp+'°';
    g.appendChild(t);
  });
})();

// A4 大アイコン
(function(){
  const icons=document.getElementById('a4icons'), mo=document.getElementById('a4mo');
  uzb.forEach(m=>{
    icons.innerHTML+=`<div style="text-align:center;font-size:1.3em">${m.icon}</div>`;
    mo.innerHTML+=`<div style="text-align:center;font-size:0.6em;color:#aaa;font-weight:600">${m.mo}月</div>`;
  });
  const pts=uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.18}`).join(' ');
  const fill=`0 4 ${pts} 100 4`;
  document.getElementById('a4fill').setAttribute('points',fill);
  document.getElementById('a4line').setAttribute('points',pts);
})();

// A5 丸バッジ
(function(){
  const top=document.getElementById('a5top'), mo=document.getElementById('a5mo');
  uzb.forEach(m=>{
    const h=Math.max(20,((m.temp-minT)/(maxT-minT))*50+20);
    top.innerHTML+=`<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:30px;height:30px;border-radius:50%;background:${bg[m.type]||'#f5e4cc'};display:flex;align-items:center;justify-content:center;font-size:0.9em;font-weight:700;color:#555">${m.temp}°</div><div style="font-size:0.9em">${m.icon}</div></div>`;
    mo.innerHTML+=`<div style="text-align:center;font-size:0.58em;color:#bbb;font-weight:600">${m.mo}月</div>`;
  });
  const pts=uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.11}`).join(' ');
  document.getElementById('a5line').setAttribute('points',pts);
})();

// A6 グラデ帯
(function(){
  const pts=uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.27}`).join(' ');
  document.getElementById('a6line').setAttribute('points',pts);
  const g=document.getElementById('a6dots');
  uzb.forEach((m,i)=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',xOf(i));c.setAttribute('cy',yOf(m.temp)*0.27);c.setAttribute('r','1.5');
    c.setAttribute('fill','#fff');c.setAttribute('stroke','#e88020');c.setAttribute('stroke-width','0.6');
    g.appendChild(c);
  });
  const row=document.getElementById('a6row');
  uzb.forEach(m=>{row.innerHTML+=`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px"><div style="font-size:1em">${m.icon}</div><div style="font-size:0.65em;font-weight:700;color:#555">${m.temp}°</div><div style="font-size:0.58em;color:#bbb">${m.mo}月</div></div>`;});
})();

// A7 ミニマル数字大
(function(){
  const pts=uzb.map((m,i)=>`${xOf(i)} ${yOf(m.temp)*0.18}`).join(' ');
  const fill=`0 3.8 ${pts} 100 3.8`;
  document.getElementById('a7fill').setAttribute('points',fill);
  document.getElementById('a7line').setAttribute('points',pts);
  const row=document.getElementById('a7row');
  uzb.forEach(m=>{row.innerHTML+=`<div style="display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px"><div style="font-size:0.88em;font-weight:900;color:#333">${m.temp}°</div><div style="font-size:0.9em">${m.icon}</div><div style="font-size:0.58em;color:#bbb">${m.mo}月</div></div>`;});
})();
</script>

</body>
</html>
