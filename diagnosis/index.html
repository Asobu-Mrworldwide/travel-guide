body { background: #fff; }

/* ヒーロー */
.lp-hero {
  background: #E5EDE9;
  min-height: 52vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
  color: #1a2a3a;
}
.lp-hero-quote {
  font-size: 2.4em;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 20px;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: #2d2d3a;
}
.lp-hero-sub {
  font-size: 0.88em;
  color: #3a3a4d;
  line-height: 1.9;
  margin-bottom: 36px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}
.lp-cta {
  display: inline-block;
  background: #15735b;
  color: #fff;
  font-weight: 700;
  font-size: 1.05em;
  border-radius: 50px;
  padding: 18px 64px;
  text-decoration: none;
  letter-spacing: 0.04em;
}
.lp-cta:hover { opacity: 0.88; transform: translateY(-1px); transition: all 0.15s; }
.lp-note {
  margin-top: 12px;
  font-size: 0.72em;
  color: rgba(45,45,58,0.35);
}

/* 統計カード */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 24px 48px;
}
.stat-card {
  background: color-mix(in srgb, var(--card-color, #15735b) 8%, #fff);
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--card-color, #15735b) 18%, #fff);
  border-top: 4px solid var(--card-color, #15735b);
  padding: 24px 16px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.stat-num {
  font-size: 2.2em;
  font-weight: 700;
  color: #1a2a3a;
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.stat-type-name {
  font-size: 1.2em;
  font-weight: 700;
  color: #1a2a3a;
  margin-bottom: 4px;
  line-height: 1.3;
}
.stat-type-code {
  font-size: 0.65em;
  font-family: monospace;
  color: #aaa;
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.stat-label {
  font-size: 0.7em;
  color: #888;
  font-weight: 500;
}

/* セクション共通 */
.lp-section {
  padding: 36px 20px;
  max-width: 640px;
  margin: 0 auto;
}
.lp-section-title {
  font-size: 0.72em;
  font-weight: 500;
  color: #15735b;
  letter-spacing: 0.1em;
  text-align: center;
  margin-bottom: 20px;
}

/* 4軸 */
.axes-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.axis-card {
  background: #fff;
  border: 1px solid #dce6e2;
  border-radius: 12px;
  padding: 12px 14px;
}
.axis-vs {
  display: flex;
  justify-content: space-between;
  font-size: 0.7em;
  color: #666;
  margin-bottom: 6px;
}
.axis-bar {
  height: 5px;
  background: #dceee8;
  border-radius: 3px;
  position: relative;
  margin-bottom: 7px;
}
.axis-fill {
  position: absolute;
  height: 5px;
  border-radius: 3px;
  background: #15735b;
}
.axis-name {
  font-size: 0.8em;
  font-weight: 500;
  color: #222;
}

/* 16タイプグリッド */
.types-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.type-chip {
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  font-size: 0.68em;
  font-weight: 500;
  color: #fff;
  line-height: 1.35;
}

/* 診断の流れ */
.steps {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: #fff;
  border: 1px solid #dce6e2;
  border-radius: 12px;
  padding: 14px 16px;
}
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #15735b;
  color: #fff;
  font-size: 0.78em;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-body strong {
  display: block;
  font-size: 0.88em;
  font-weight: 500;
  color: #111;
  margin-bottom: 3px;
}
.step-body span {
  font-size: 0.78em;
  color: #666;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .lp-hero-quote { font-size: 1.6em; white-space: normal; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 20px 16px 0; }
  .stat-num { font-size: 1.7em; }
}
</style>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const TYPE_NAMES = {
  PISH:'中間管理職', PISW:'特派員', PILH:'茶道部', PILW:'凝り性',
  POSH:'工場長', POSW:'シェルパ', POLH:'温泉ソムリエ', POLW:'猟師',
  FISH:'ゴールデンレトリバー', FISW:'お祭り男', FILH:'探偵', FILW:'風来坊',
  FOSH:'副本部長', FOSW:'ダチョウ', FOLH:'独身貴族', FOLW:'ターザン'
};

function countUp(el, target, suffix = '') {
  const duration = 1200, start = performance.now();
  const step = now => {
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(eased * target).toLocaleString('ja-JP') + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

try {
  const app = getApps().length ? getApp() : initializeApp({
    apiKey: "AIzaSyBUhndaLEcGHW4SKzSsZ4--HW4zXM2plD0",
    authDomain: "worldmappy-923a6.firebaseapp.com",
    databaseURL: "https://worldmappy-923a6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "worldmappy-923a6",
    storageBucket: "worldmappy-923a6.firebasestorage.app",
    messagingSenderId: "957333409172",
    appId: "1:957333409172:web:9fedbda60722820fa9d381"
  });
  const db = getDatabase(app);
  const today = new Date().toLocaleDateString('sv-SE');

  const [totalSnap, todaySnap, typesSnap, goodSnap, badSnap] = await Promise.all([
    get(ref(db, 'diagnosis/total')),
    get(ref(db, 'diagnosis/daily/' + today)),
    get(ref(db, 'types')),
    get(ref(db, 'feedback/good')),
    get(ref(db, 'feedback/bad')),
  ]);

  countUp(document.getElementById('stat-total'), totalSnap.val() || 0);
  countUp(document.getElementById('stat-today'), todaySnap.val() || 0);

  const good = goodSnap.val() || 0, bad = badSnap.val() || 0;
  if (good + bad > 0) {
    countUp(document.getElementById('stat-accuracy'), Math.round(good / (good + bad) * 100), '%');
  }

  const typesData = typesSnap.val();
  if (typesData) {
    const topCode = Object.entries(typesData).reduce((a, b) => b[1] > a[1] ? b : a)[0];
    const nameEl = document.getElementById('stat-top-name');
    nameEl.className = 'stat-type-name';
    nameEl.textContent = TYPE_NAMES[topCode] || topCode;
    document.getElementById('stat-top-code').textContent = topCode;
  }
} catch(e) { console.error('Firebase stats error:', e); }
</script>

    document.getElementById('hb-btn').classList.remove('open');

</script>
