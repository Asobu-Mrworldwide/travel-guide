<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行タイプ診断 | World Mappy</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1d9074;
  --green-dark:#15735b;
  --green-light:#e8f6f2;
  --text:#1a1a1a;
  --sub:#555;
  --border:#dce6e2;
}
body{
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium',YuGothic,Meiryo,sans-serif;
  background:#f0f4f2;
  color:var(--text);
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

/* ヘッダー */
.site-header{background:var(--green-dark);padding:13px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.15);position:sticky;top:0;z-index:100}
.site-logo{font-size:1.3em;font-weight:900;color:#fff;letter-spacing:-0.5px;text-decoration:none}
.site-logo span{color:#ffc200}
.site-tagline{font-size:0.75em;color:rgba(255,255,255,0.65);margin-left:auto}

/* レイアウト */
.page-wrap{max-width:720px;margin:0 auto;padding:0 20px 60px}

/* ヒーロー */
.diag-hero{text-align:center;padding:44px 20px 28px}
.diag-badge{display:inline-block;background:var(--green);color:#fff;font-size:0.72em;font-weight:700;padding:3px 14px;border-radius:20px;margin-bottom:14px}
.diag-hero h1{font-size:1.55em;font-weight:900;margin-bottom:10px;line-height:1.3}
.diag-hero p{font-size:0.85em;color:var(--sub);line-height:1.85;max-width:480px;margin:0 auto}

/* プログレスバー */
.progress-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 18px;margin:0 0 20px}
.progress-label{display:flex;justify-content:space-between;font-size:0.78em;margin-bottom:8px}
.progress-label span:first-child{font-weight:700}
.progress-label span:last-child{color:var(--green);font-weight:700}
.progress-bar-bg{background:#e4eceb;border-radius:20px;height:7px;overflow:hidden}
.progress-bar-fill{background:var(--green);height:100%;border-radius:20px;width:0%;transition:width 0.3s ease}

/* スワイプセクション */
.swipe-section{margin-bottom:32px;position:relative}

/* サイドラベル */
.swipe-side-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;height:32px}
.ssl{font-size:0.8em;font-weight:700;opacity:0;transition:opacity 0.1s;display:flex;align-items:center;gap:6px;pointer-events:none}
.ssl-left{color:#c94a29}
.ssl-right{color:var(--green)}
.ssl-arrow{font-size:1.3em;line-height:1}

/* カードスタック */
.card-stack{position:relative;height:340px;margin:0 auto;max-width:420px;touch-action:pan-y}

/* スワイプカード */
.swipe-card{
  position:absolute;inset:0;
  background:#fff;border-radius:16px;
  box-shadow:0 6px 28px rgba(0,0,0,0.1);
  display:flex;flex-direction:column;
  overflow:hidden;
  cursor:grab;user-select:none;
  transform-origin:50% 110%;
  will-change:transform;
  transition:transform 0.3s ease,opacity 0.3s ease;
}
.swipe-card[data-behind="1"]{transform:scale(0.95) translateY(10px);pointer-events:none}
.swipe-card[data-behind="2"]{transform:scale(0.90) translateY(20px);pointer-events:none}
.swipe-card[data-behind="3"]{transform:scale(0.87) translateY(28px);pointer-events:none;opacity:0}

.sc-body{padding:24px 24px 14px;flex:1;display:flex;flex-direction:column;justify-content:center}
.sc-qnum{font-size:0.7em;font-weight:700;color:var(--green);margin-bottom:10px;letter-spacing:0.04em;display:flex;align-items:center;gap:8px}
.sc-backup-badge{background:#f0a500;color:#fff;font-size:0.78em;font-weight:700;padding:1px 8px;border-radius:10px;letter-spacing:0}
.sc-text{font-size:0.97em;font-weight:700;line-height:1.7;color:var(--text)}

/* 選択肢 */
.sc-choices{display:grid;grid-template-columns:1fr 1px 1fr;border-top:1px solid var(--border)}
.sc-choice{padding:14px 16px;font-size:0.85em;font-weight:700;color:#b0b8b4;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 0.15s,background 0.15s}
.sc-choice-arrow{font-size:1.1em;line-height:1}
.sc-choice-label{font-size:0.95em}
.sc-left{border-radius:0 0 0 16px}
.sc-right{border-radius:0 0 16px 0}
.sc-divider{background:var(--border)}
.swipe-card.dragging-left .sc-left{color:#c94a29;background:#fff5f3}
.swipe-card.dragging-right .sc-right{color:var(--green);background:var(--green-light)}

/* カラーオーバーレイ */
.sc-overlay{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:16px}
.sc-overlay-l{background:linear-gradient(135deg,rgba(201,74,41,0.15) 0%,transparent 60%)}
.sc-overlay-r{background:linear-gradient(225deg,rgba(29,144,116,0.15) 0%,transparent 60%)}

/* リセットボタン */
.diag-reset{display:inline-block;background:none;border:1.5px solid var(--border);color:var(--sub);border-radius:30px;padding:9px 26px;font-size:0.82em;font-weight:700;cursor:pointer;margin-top:12px;transition:border-color 0.2s,color 0.2s;font-family:inherit}
.diag-reset:hover{border-color:var(--green);color:var(--green)}

/* 結果セクション */
#result-section{display:none}
#result-section.show{display:block;animation:fadeUp 0.45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* 結果カード */
.result-card{border-radius:14px;overflow:hidden;margin:32px 0 20px;box-shadow:0 6px 28px rgba(0,0,0,0.12)}
.result-card-top{padding:36px 24px 28px;text-align:center;color:#fff;position:relative}
.result-illust{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;background:rgba(255,255,255,0.18);border:3px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:3.2em;line-height:1}
.result-type-code{font-size:2.8em;font-weight:900;letter-spacing:5px;line-height:1;margin-bottom:6px;font-family:monospace,sans-serif;opacity:0.85}
.result-type-name{font-size:1.35em;font-weight:900;margin-bottom:14px;line-height:1.3}
.result-traits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.trait-badge{background:rgba(255,255,255,0.2);color:#fff;font-size:0.73em;font-weight:700;padding:4px 13px;border-radius:20px;border:1px solid rgba(255,255,255,0.32)}

.result-card-body{background:#fff;padding:22px 22px 28px}
.result-body-label{font-size:0.7em;font-weight:700;color:var(--green);margin-bottom:6px;letter-spacing:0.04em}
.result-desc{font-size:0.86em;color:#333;line-height:1.85}

/* ─── セクションヘッダー 1・2・3 ─── */
.rsec-header{display:flex;align-items:center;gap:10px;margin:22px 0 14px;padding-top:20px;border-top:1px solid var(--border)}
.rsec-num{width:24px;height:24px;background:var(--green);color:#fff;border-radius:50%;font-size:0.72em;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rsec-title{font-size:0.92em;font-weight:900}

/* ─── 性格特性: 軸グリッド ─── */
.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.axis-card{background:#f8faf9;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.axis-card-label{font-size:0.64em;font-weight:700;color:var(--sub);margin-bottom:8px;letter-spacing:0.05em}
.axis-toggle{display:flex;gap:5px;margin-bottom:8px}
.axis-opt{flex:1;padding:5px 6px;border-radius:6px;font-size:0.7em;font-weight:700;text-align:center;background:#e8eceb;color:#aaa;line-height:1.3}
.axis-opt.selected{background:var(--green);color:#fff}
.axis-desc{font-size:0.73em;color:#555;line-height:1.6}

/* ─── 旅スタイル ─── */
.travel-style-box{background:#f4f8f6;border-radius:10px;padding:14px 16px;font-size:0.86em;color:#333;line-height:1.85;border-left:3px solid var(--green)}

/* ─── 相性ミニカード（自動算出） ─── */
.compat-group-label{font-size:0.76em;font-weight:700;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.cg-good{color:var(--green)}
.cg-bad{color:#c94a29}
.compat-mini-list{display:flex;flex-direction:column;gap:8px}
.cmc{background:#fff;border-radius:10px;border:1px solid var(--border);border-left-width:3px;padding:12px 14px}
.cmc-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cmc-code{font-size:0.78em;font-weight:900;font-family:monospace,sans-serif;flex-shrink:0;min-width:38px}
.cmc-name{font-size:0.8em;font-weight:700;flex:1;min-width:0}
.cmc-pct{font-size:0.85em;font-weight:900;flex-shrink:0}
.cmc-bar-bg{width:52px;height:4px;background:#e4eceb;border-radius:20px;overflow:hidden;flex-shrink:0}
.cmc-bar-fill{height:100%;border-radius:20px}
.cmc-text{font-size:0.75em;color:var(--sub);line-height:1.55}
.compat-note{font-size:0.74em;color:var(--sub);margin-top:14px;line-height:1.65;padding:10px 14px;background:#f8faf9;border-radius:8px;border:1px solid var(--border)}

/* ─── 国を探すCTAボタン ─── */
.country-search-cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green);color:#fff;text-decoration:none;padding:16px 24px;border-radius:30px;font-size:0.92em;font-weight:900;margin:24px 0 12px;transition:background 0.2s;box-shadow:0 4px 16px rgba(29,144,116,0.28)}
.country-search-cta:hover{background:var(--green-dark)}
.cta-arrow{font-size:1.1em}

/* フッター */
footer{text-align:center;padding:32px 16px;font-size:0.78em;color:#fff;background:#6B5E62;margin-top:0}
footer a{color:#fff;text-decoration:none;margin:0 10px}
footer a:hover{text-decoration:underline}

/* レスポンシブ */
@media(max-width:520px){
  .result-type-code{font-size:2.2em;letter-spacing:4px}
  .result-type-name{font-size:1.15em}
  .diag-hero h1{font-size:1.3em}
  .result-illust{width:100px;height:100px;font-size:2.6em}
  .page-wrap{padding:0 14px 50px}
}
@media(max-width:480px){
  .axis-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="site-header">
  <a href="../" class="site-logo">World <span>Mappy</span></a>
  <span class="site-tagline">世界の旅行ガイド</span>
</header>

<div class="page-wrap">

  <!-- ヒーロー -->
  <div class="diag-hero">
    <div><span class="diag-badge">16問・無料診断</span></div>
    <h1>あなたの旅行タイプを診断</h1>
    <p>計画性・旅の目的（文化 vs 絶景・リフレッシュ）・社交性・快適さの4軸から、旅のスタイルを16タイプに分類します。右スワイプで「はい」、左スワイプで「いいえ」。一緒に旅する相手との相性もわかります。</p>
  </div>

  <!-- プログレスバー -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>回答の進み具合</span>
      <span id="progress-text">0 / 16 問</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- スワイプ診断 -->
  <div class="swipe-section" id="swipe-section">
    <div class="swipe-side-labels">
      <div class="ssl ssl-left" id="ssl-left"><span class="ssl-arrow">←</span><span>いいえ</span></div>
      <div class="ssl ssl-right" id="ssl-right"><span>はい</span><span class="ssl-arrow">→</span></div>
    </div>
    <div class="card-stack" id="card-stack"></div>
  </div>

  <!-- 結果セクション -->
  <div id="result-section">
    <div class="result-card">
      <div class="result-card-top" id="result-top">
        <div class="result-illust" id="result-illust"></div>
        <div class="result-type-code" id="result-code"></div>
        <div class="result-type-name" id="result-name"></div>
        <div class="result-traits" id="result-traits"></div>
      </div>
      <div class="result-card-body">

        <!-- 1 性格特性 -->
        <div class="rsec-header">
          <span class="rsec-num">1</span>
          <span class="rsec-title">性格特性</span>
        </div>
        <div class="axis-grid" id="axis-grid"></div>
        <div class="result-body-label">総合タイプ解説</div>
        <div class="result-desc" id="result-desc"></div>

        <!-- 2 おすすめ旅スタイル -->
        <div class="rsec-header">
          <span class="rsec-num">2</span>
          <span class="rsec-title">おすすめ旅スタイル</span>
        </div>
        <div class="travel-style-box" id="result-travel-style"></div>

        <!-- 3 相性のいい旅行タイプ -->
        <div class="rsec-header">
          <span class="rsec-num">3</span>
          <span class="rsec-title">相性のいい旅行タイプ</span>
        </div>
        <div id="compat-auto"></div>

      </div>
    </div>

    <a class="country-search-cta" id="country-search-cta" href="../">
      <span>このタイプに合う国を探す</span>
      <span class="cta-arrow">→</span>
    </a>

    <div style="text-align:center;margin-top:4px">
      <button class="diag-reset" id="reset-btn">もう一度診断する</button>
    </div>
  </div>

</div><!-- /page-wrap -->

<footer>
  <a href="../">トップへ戻る</a>
</footer>

<script>
// ===== 質問データ =====
const BASE_QUESTIONS = {
  PF: [
    {yesVal:'P', text:'旅行前に、行程表を作ってから出発する'},
    {yesVal:'F', text:'気になる店を見つけたら、予定になくてもその場で入る'},
    {yesVal:'P', text:'宿や移動手段は、出発前にすべて予約しておく'},
    {yesVal:'F', text:'予定が崩れても、逆に面白い展開だと思える'},
  ],
  IO: [
    {yesVal:'I', text:'歴史的建造物や美術館を見ると、テンションが上がる'},
    {yesVal:'O', text:'旅先で絶景スポットや展望台があれば、優先的に訪れる'},
    {yesVal:'I', text:'旅の思い出は「学んだこと」として残ることが多い'},
    {yesVal:'O', text:'観光より、海やスパでのんびりする方が旅の目的だ'},
  ],
  SL: [
    {yesVal:'S', text:'旅先では、同行者と感動をその場で共有できると満足度が上がる'},
    {yesVal:'L', text:'旅中、自分だけで動く時間が一定量ないとしんどい'},
    {yesVal:'S', text:'旅仲間のペースや好みに合わせるのは、それほど苦にならない'},
    {yesVal:'L', text:'旅先でも、起床や食事のタイミングを自分で決めたい'},
  ],
  HW: [
    {yesVal:'H', text:'宿は、清潔さや設備の良さを最優先で選ぶ'},
    {yesVal:'W', text:'現地らしい多少不便な場所にも、むしろ行ってみたい'},
    {yesVal:'H', text:'移動は、タクシーなど快適な手段を優先したい'},
    {yesVal:'W', text:'停電・断水・虫などのトラブルも、旅の醍醐味だと思える'},
  ],
};

const BACKUP_QUESTIONS = {
  PF: {axis:'PF', yesVal:'P', text:'旅先での移動時間や乗り換えを、細かく事前に調べておく'},
  IO: {axis:'IO', yesVal:'I', text:'現地の生活や文化的背景を知ると、旅の満足度が上がる'},
  SL: {axis:'SL', yesVal:'S', text:'一人で食事やアクティビティをするのに、少し抵抗がある'},
  HW: {axis:'HW', yesVal:'H', text:'多少値段が高くても、快適さを優先して宿や移動を選ぶ'},
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledBase() {
  const all = [];
  Object.entries(BASE_QUESTIONS).forEach(([axis, qs]) => {
    qs.forEach(q => all.push({...q, axis}));
  });
  return shuffle(all);
}

// ===== 軸情報 =====
const AXIS_INFO = {
  PF:{label:'計画性',
    P:{short:'計画派',desc:'行程・宿・交通を事前に固める安心型。計画通りに動くことで旅の満足度が高まる。'},
    F:{short:'直感派',desc:'その場の感覚や偶然の出会いに委ねる自由型。予定外の発見が旅の醍醐味になる。'}},
  IO:{label:'旅の目的',
    I:{short:'文化・学び重視',desc:'歴史・美術・現地文化への好奇心が旅の原動力。場所の背景を知ることで旅の深みが増す。'},
    O:{short:'絶景・リフレッシュ重視',desc:'大自然・ビーチ・絶景や、温泉・スパでの充電が旅の目的。五感で感じる体験を求める。'}},
  SL:{label:'行動スタイル',
    S:{short:'協調派',desc:'仲間との感動の共有が旅の喜び。グループでの体験が旅の充実度を高める。'},
    L:{short:'マイペース派',desc:'自分のペースと興味で動く独立型。自由行動の時間が旅の質を保つ鍵。'}},
  HW:{label:'快適さへのこだわり',
    H:{short:'快適志向',desc:'宿の清潔さ・快適な移動・整った設備を重視。旅のストレスを最小限に抑えて楽しめる。'},
    W:{short:'ワイルド志向',desc:'多少の不便や予定外のトラブルも旅の一部として楽しめる順応型。現地らしい環境に飛び込む。'}},
};

// ===== 16タイプ定義 =====
const TYPES = {
  PISH:{name:'文化旅行の設計者', color:'#2563a0',
    traits:['計画派','文化・学び','協調派','快適志向'],
    desc:'綿密な計画で仲間と快適に文化旅行を楽しむタイプ。美術館や遺跡を事前リサーチし、ランチもディナーも予約済みで迷わない。グループ旅行の頼れる幹事として輝く存在。',
    travelStyle:'綿密な行程で仲間と快適に文化・歴史を巡るタイプ。美術館や世界遺産を効率よく回り、快適なホテルでその日の発見を語り合う夜が旅のクライマックス。ヨーロッパの歴史都市や東アジアの文化圏が特に向いている。'},
  PISW:{name:'調査隊長', color:'#1a6b3a',
    traits:['計画派','文化・学び','協調派','ワイルド'],
    desc:'計画を立てて仲間と文化・歴史の探求に出かけるタイプ。多少不便な場所でも計画通りに動き、仲間と学びを共有する。フィールドワーク型の旅が得意な頼れるリーダー。',
    travelStyle:'計画したルートで仲間と文化・歴史の探求に出かける体力型旅人。多少の不便も仲間と笑えれば問題なし。遺跡や史跡を歩いて巡るフィールドワーク型の旅が最も充実する。シルクロードや東南アジアの歴史地区が向いている。'},
  PILH:{name:'静かな学者', color:'#7b5ea7',
    traits:['計画派','文化・学び','マイペース派','快適志向'],
    desc:'計画的にマイペースで快適に文化を巡るタイプ。美術館の閉館時間やアクセス方法を事前に調べ、自分のペースで展示や史跡に向き合う。快適な宿で旅の余韻と学びを整理する時間も旅の一部。',
    travelStyle:'事前に調べ尽くしてから、一人または少人数で展示や史跡とじっくり向き合う旅が理想。快適な宿で振り返りと読書ができる環境を重視。美術館の閉館時間まで計算に入れた丁寧な旅のスタイル。'},
  PILW:{name:'フィールドワーカー', color:'#4a7a59',
    traits:['計画派','文化・学び','マイペース派','ワイルド'],

// ===== 相性計算 =====
const AXIS_MISMATCH_NOTES = [
  '計画性とその場のノリが逆方向。役割を分けると旅がスムーズ。',
  '文化・学びと絶景・リフレッシュで旅の目的が異なる。時間配分を話し合って。',
  'マイペース派と協調派でペースが違う。自由行動の時間を意識的に設けるとうまくいく。',
  '宿・移動の快適さへのこだわりが逆。予算配分を事前に決めておこう。',
];
function getCompat(typeA, typeB) {
  const mismatches = [0,1,2,3].filter(i => typeA[i] !== typeB[i]);
  const matchCount = 4 - mismatches.length;
  const pct = [20, 40, 60, 78, 95][matchCount];

  let text;
  if (matchCount === 4) {
    text = 'ほぼ同じ旅スタイル。意見が一致しやすく、旅の計画がスムーズ。似すぎて刺激が少なくなることだけ注意。';
  } else if (matchCount === 0) {
    text = '4軸すべて逆方向のタイプ。旅の目的・ペース・過ごし方が根本から異なる。事前に優先事項を丁寧にすり合わせることが必須。';
  } else {
    const notes = mismatches.map(i => AXIS_MISMATCH_NOTES[i]);
    if (matchCount === 3) {
      text = `旅のスタイルはほぼ同じ。${notes[0]}`;
    } else if (matchCount === 2) {
      text = `2軸は一致、残り2軸でズレがある。${notes.join(' ')}`;
    } else {
      text = `スタイルの差が大きめ。${notes.join(' ')} 旅の前に目的を共有しておこう。`;
    }
  }
  return {pct, text};
}

// ===== スワイプUI =====
let myType = null;
let currentIdx = 0;
let totalQuestions = 16;
let axisVotes = {};
let questionQueue = [];
let mouseMoveHandler = null;
let mouseUpHandler = null;

function getOppositeVal(v) {
  return {P:'F',F:'P',I:'O',O:'I',S:'L',L:'S',H:'W',W:'H'}[v];
}

function updateProgress(n, total) {
  document.getElementById('progress-fill').style.width = (n / total * 100) + '%';
  document.getElementById('progress-text').textContent = n + ' / ' + total + ' 問';
}

function initSwipe() {
  questionQueue = buildShuffledBase();
  currentIdx = 0;
  totalQuestions = 16;
  axisVotes = {PF:{P:0,F:0}, IO:{I:0,O:0}, SL:{S:0,L:0}, HW:{H:0,W:0}};
  updateProgress(0, 16);

  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';

  [...questionQueue].reverse().forEach((q, revIdx) => {
    const realIdx = questionQueue.length - 1 - revIdx;
    appendCard(q, realIdx + 1, Math.min(realIdx, 3));
  });

  attachSwipeHandlers();
}

function appendCard(q, displayNum, behind, isBackup) {
  const stack = document.getElementById('card-stack');
  const card = document.createElement('div');
  card.className = 'swipe-card';
  if (behind > 0) card.dataset.behind = String(behind);

  const qnumHtml = isBackup
    ? `Q${displayNum} <span class="sc-backup-badge">追加問題</span>`
    : `Q${displayNum} / ${totalQuestions}`;

  card.innerHTML = `
    <div class="sc-overlay sc-overlay-l"></div>
    <div class="sc-overlay sc-overlay-r"></div>
    <div class="sc-body">
      <div class="sc-qnum">${qnumHtml}</div>
      <div class="sc-text">${q.text}</div>
    </div>
    <div class="sc-choices">
      <div class="sc-choice sc-left">
        <span class="sc-choice-arrow">←</span>
        <span class="sc-choice-label">いいえ</span>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-choice sc-right">
        <span class="sc-choice-label">はい</span>
        <span class="sc-choice-arrow">→</span>
      </div>
    </div>`;
  stack.appendChild(card);
}

function getActiveCard() {
  const cards = document.querySelectorAll('.swipe-card');
  return cards.length ? cards[cards.length - 1] : null;
}

function attachSwipeHandlers() {
  const stack = document.getElementById('card-stack');
  if (mouseMoveHandler) document.removeEventListener('mousemove', mouseMoveHandler);
  if (mouseUpHandler)   document.removeEventListener('mouseup',   mouseUpHandler);

  let startX = 0, startY = 0, isDragging = false;
  let activeCard = null;
  const THRESHOLD = 90;

  function onStart(x, y) {
    activeCard = getActiveCard();
    if (!activeCard) return;
    startX = x; startY = y;
    isDragging = true;
    activeCard.style.transition = 'none';
  }

  function onMove(x, y) {
    if (!isDragging || !activeCard) return;
    const dx = x - startX;
    const dy = y - startY;
    if (Math.abs(dy) > Math.abs(dx) * 1.8 && Math.abs(dx) < 20) {
      isDragging = false; return;
    }

    activeCard.style.transform = `translateX(${dx}px) rotate(${dx / 320 * 18}deg)`;
    const pct = Math.min(Math.abs(dx) / THRESHOLD, 1);
    const ovlL = activeCard.querySelector('.sc-overlay-l');
    const ovlR = activeCard.querySelector('.sc-overlay-r');

    if (dx < 0) {
      ovlL.style.opacity = pct; ovlR.style.opacity = 0;
      activeCard.classList.add('dragging-left'); activeCard.classList.remove('dragging-right');
    } else if (dx > 0) {
      ovlR.style.opacity = pct; ovlL.style.opacity = 0;
      activeCard.classList.add('dragging-right'); activeCard.classList.remove('dragging-left');
    } else {
      ovlL.style.opacity = 0; ovlR.style.opacity = 0;
      activeCard.classList.remove('dragging-left','dragging-right');
    }

    document.getElementById('ssl-left').style.opacity  = dx < 0 ? pct : 0;
    document.getElementById('ssl-right').style.opacity = dx > 0 ? pct : 0;
  }

  function onEnd(x) {
    if (!isDragging || !activeCard) return;
    isDragging = false;
    const dx = x - startX;
    if (Math.abs(dx) >= THRESHOLD) {
      commitSwipe(dx > 0 ? 'right' : 'left', activeCard);
    } else {
      activeCard.style.transition = 'transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275)';
      activeCard.style.transform = '';
      activeCard.querySelector('.sc-overlay-l').style.opacity = 0;
      activeCard.querySelector('.sc-overlay-r').style.opacity = 0;
      activeCard.classList.remove('dragging-left','dragging-right');
      document.getElementById('ssl-left').style.opacity  = 0;
      document.getElementById('ssl-right').style.opacity = 0;
    }
    activeCard = null;
  }

  stack.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  stack.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:false});
  stack.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientX));
  stack.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });

  mouseMoveHandler = e => onMove(e.clientX, e.clientY);
  mouseUpHandler   = e => onEnd(e.clientX);
  document.addEventListener('mousemove', mouseMoveHandler);
  document.addEventListener('mouseup',   mouseUpHandler);
}

function commitSwipe(dir, card) {
  const q = questionQueue[currentIdx];
  const val = dir === 'right' ? q.yesVal : getOppositeVal(q.yesVal);
  axisVotes[q.axis][val]++;

  const flyX = dir === 'right' ? window.innerWidth + 100 : -(window.innerWidth + 100);
  card.style.transition = 'transform 0.45s cubic-bezier(0.55,0,1,0.7),opacity 0.35s';
  card.style.transform  = `translateX(${flyX}px) rotate(${dir==='right'?25:-25}deg)`;
  card.style.opacity = '0';
  card.style.pointerEvents = 'none';

  document.getElementById('ssl-left').style.opacity  = 0;
  document.getElementById('ssl-right').style.opacity = 0;

  currentIdx++;
  updateProgress(currentIdx, totalQuestions);

  const remaining = Array.from(document.querySelectorAll('.swipe-card')).filter(c => c !== card);
  const n = remaining.length;
  remaining.forEach((c, i) => {
    const behind = n - 1 - i;
    if (behind === 0) {
      c.style.transition = 'transform 0.3s ease';
      void c.getBoundingClientRect();
      c.removeAttribute('data-behind');
    } else {
      c.dataset.behind = String(Math.min(behind, 3));
    }
  });

  setTimeout(() => {
    card.remove();

    if (currentIdx === 16) {
      const tiedAxes = Object.keys(axisVotes).filter(axis => {
        const vals = Object.values(axisVotes[axis]);
        return vals[0] === vals[1];
      });

      if (tiedAxes.length > 0) {
        totalQuestions = 16 + tiedAxes.length;
        updateProgress(currentIdx, totalQuestions);
        [...tiedAxes].reverse().forEach((axis, revIdx) => {
          const bIdx = tiedAxes.length - 1 - revIdx;
          const bq = BACKUP_QUESTIONS[axis];
          questionQueue.push(bq);
          appendCard(bq, 16 + bIdx + 1, Math.min(bIdx, 3), true);
        });
      } else {
        computeAndShowResult();
      }
    } else if (currentIdx === totalQuestions) {
      computeAndShowResult();
    }
  }, 500);
}

function computeAndShowResult() {
  const pf = axisVotes.PF.P >= axisVotes.PF.F ? 'P' : 'F';
  const io = axisVotes.IO.I >= axisVotes.IO.O ? 'I' : 'O';
  const sl = axisVotes.SL.S >= axisVotes.SL.L ? 'S' : 'L';
  const hw = axisVotes.HW.H >= axisVotes.HW.W ? 'H' : 'W';
  myType = pf + io + sl + hw;
  document.getElementById('swipe-section').style.display = 'none';
  document.querySelector('.progress-wrap').style.display  = 'none';
  showResult(myType);
}

function showResult(type) {
  const t = TYPES[type];

  document.getElementById('result-code').textContent = type;
  document.getElementById('result-name').textContent = t.name;
  document.getElementById('result-desc').textContent = t.desc;
  document.getElementById('result-top').style.background = t.color;
  document.getElementById('result-traits').innerHTML =
    t.traits.map(tr => `<span class="trait-badge">${tr}</span>`).join('');

  // IO軸に応じたアイコン
  document.getElementById('result-illust').textContent = type[1] === 'I' ? '🏛️' : '🏖️';

  // 1 性格特性: 軸グリッド
  buildAxisGrid(type);

  // 2 おすすめ旅スタイル
  document.getElementById('result-travel-style').textContent = t.travelStyle;

  // 3 相性のいい旅行タイプ（自動算出）
  buildAutoCompat(type);

  // 国探しCTAのリンク
  document.getElementById('country-search-cta').href = '../index.html?type=' + type;

  const rs = document.getElementById('result-section');
  rs.style.display = 'block';
  rs.classList.add('show');
  rs.scrollIntoView({behavior:'smooth', block:'start'});
}

function buildAxisGrid(type) {
  const axes = [
    {key:'PF', val:type[0]},
    {key:'IO', val:type[1]},
    {key:'SL', val:type[2]},
    {key:'HW', val:type[3]},
  ];
  const grid = document.getElementById('axis-grid');
  grid.innerHTML = axes.map(({key, val}) => {
    const info = AXIS_INFO[key];
    const [a, b] = key.split('');
    const aInfo = info[a], bInfo = info[b];
    const selectedInfo = val === a ? aInfo : bInfo;
    return `
    <div class="axis-card">
      <div class="axis-card-label">${info.label}</div>
      <div class="axis-toggle">
        <div class="axis-opt${val===a?' selected':''}">${aInfo.short}</div>
        <div class="axis-opt${val===b?' selected':''}">${bInfo.short}</div>
      </div>
      <div class="axis-desc">${selectedInfo.desc}</div>
    </div>`;
  }).join('');
}

function buildAutoCompat(myType) {
  const scores = Object.entries(TYPES)
    .filter(([code]) => code !== myType)
    .map(([code, info]) => ({ code, info, ...getCompat(myType, code) }))
    .sort((a, b) => b.pct - a.pct);

  const top3 = scores.slice(0, 3);
  const bottom3 = scores.slice(-3).reverse();

  function renderCards(items) {
    return items.map(({code, info, pct, text}) => `
    <div class="cmc" style="border-left-color:${info.color}">
      <div class="cmc-header">
        <span class="cmc-code" style="color:${info.color}">${code}</span>
        <span class="cmc-name">${info.name}</span>
        <span class="cmc-pct" style="color:${info.color}">${pct}%</span>
        <div class="cmc-bar-bg"><div class="cmc-bar-fill" style="width:${pct}%;background:${info.color}"></div></div>
      </div>
      <div class="cmc-text">${text}</div>
    </div>`).join('');
  }

  document.getElementById('compat-auto').innerHTML = `
    <div class="compat-group-label cg-good">◎ 相性が良いタイプ（上位3つ）</div>
    <div class="compat-mini-list">${renderCards(top3)}</div>
    <div class="compat-group-label cg-bad" style="margin-top:18px">△ 工夫が必要なタイプ（下位3つ）</div>
    <div class="compat-mini-list">${renderCards(bottom3)}</div>
    <div class="compat-note">旅のスタイルが異なっていても、お互いの特性を理解して役割を分担すれば旅の幅が広がります。</div>`;
}

document.getElementById('reset-btn').addEventListener('click', () => {
  myType = null;
  const rs = document.getElementById('result-section');
  rs.style.display = 'none';
  rs.classList.remove('show');

  document.getElementById('swipe-section').style.display = '';
  document.querySelector('.progress-wrap').style.display  = '';

  initSwipe();
  document.getElementById('swipe-section').scrollIntoView({behavior:'smooth', block:'start'});
});

initSwipe();
</script>
</body>
</html>
