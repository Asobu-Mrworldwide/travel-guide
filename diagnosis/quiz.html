<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行タイプ診断 | World Mappy</title>

<link rel="stylesheet" href="diagnosis.css">
<style>

/* ヒーロー */
.diag-hero{text-align:center;padding:44px 20px 12px}
.diag-hero h1{font-size:1.55em;font-weight:900;margin-bottom:10px;line-height:1.3}
.diag-hero p{font-size:0.85em;color:var(--sub);line-height:1.85;max-width:480px;margin:0 auto}


/* スワイプセクション */
.swipe-section{margin-bottom:32px;position:relative}

/* カードスタック */
.card-stack{position:relative;height:340px;margin:0 auto;max-width:420px;touch-action:pan-y}

/* スワイプカード */
.swipe-card{
  position:absolute;inset:0;
  background:#fff;border-radius:16px;
  box-shadow:0 6px 28px rgba(0,0,0,0.1);
  display:flex;flex-direction:column;
  overflow:hidden;
  cursor:grab;user-select:none;
  transform-origin:50% 110%;
  will-change:transform;
  transition:transform 0.3s ease,opacity 0.3s ease;
}
.swipe-card[data-behind="1"]{transform:scale(0.95) translateY(10px);pointer-events:none}
.swipe-card[data-behind="2"]{transform:scale(0.90) translateY(20px);pointer-events:none}
.swipe-card[data-behind="3"]{transform:scale(0.87) translateY(28px);pointer-events:none;opacity:0}

.sc-progress{height:3px;background:var(--border)}
.sc-progress-fill{height:100%;background:var(--green);transition:width 0.35s ease}
.sc-body{padding:22px 24px 14px;flex:1;display:flex;flex-direction:column;justify-content:flex-start}
.sc-qnum{margin-bottom:14px;letter-spacing:0.01em;display:flex;align-items:baseline;gap:7px}
.sc-qnum-num{font-size:1.05em;font-weight:800;color:var(--green)}
.sc-qnum-total{font-size:0.78em;font-weight:700;color:#9fb3ab}
.sc-backup-badge{background:#f0a500;color:#fff;font-size:0.7em;font-weight:700;padding:2px 9px;border-radius:10px;letter-spacing:0}
.sc-text-wrap{flex:1;display:flex;align-items:center}
.sc-text{font-size:1.32em;font-weight:600;line-height:1.55;color:var(--text)}

/* 選択肢 */
.sc-choices{display:grid;grid-template-columns:1fr 1px 1fr;border-top:1px solid var(--border)}
.sc-choice{padding:14px 16px;font-size:0.85em;font-weight:700;color:#b0b8b4;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 0.15s,background 0.15s}
.sc-choice-arrow{font-size:1.1em;line-height:1}
.sc-choice-label{font-size:0.95em}
.sc-left{border-radius:0 0 0 16px}
.sc-right{border-radius:0 0 16px 0}
.sc-divider{background:var(--border)}
.swipe-card.dragging-left .sc-left{color:#c94a29;background:#fff5f3}
.swipe-card.dragging-right .sc-right{color:var(--green);background:var(--green-light)}

/* カラーオーバーレイ */
.sc-overlay{position:absolute;inset:0;opacity:0;pointer-events:none;border-radius:16px}
.sc-overlay-l{background:linear-gradient(135deg,rgba(201,74,41,0.15) 0%,transparent 60%)}
.sc-overlay-r{background:linear-gradient(225deg,rgba(29,144,116,0.15) 0%,transparent 60%)}

/* チュートリアルカード */
.tutorial-intro{
  position:absolute;inset:0;
  background:#fff;border-radius:16px;
  box-shadow:0 6px 28px rgba(0,0,0,0.1);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 20px;text-align:center;
  z-index:5;
  transition:opacity 0.3s,transform 0.3s;
}
.tutorial-intro.hiding{opacity:0;transform:scale(0.95);pointer-events:none}
.swipe-card.tut-sway{animation:tutCardSway 3.4s ease-in-out infinite}
@keyframes tutCardSway{
  0%,10%  {transform:rotate(0deg) translateX(0)}
  30%,48% {transform:rotate(4deg) translateX(14px)}
  58%,64% {transform:rotate(0deg) translateX(0)}
  80%,92% {transform:rotate(-4deg) translateX(-14px)}
  100%    {transform:rotate(0deg) translateX(0)}
}
.tut-start-btn{
  background:var(--green);color:#fff;
  font-weight:700;font-size:0.92em;
  border:none;border-radius:50px;
  padding:13px 44px;cursor:pointer;
  letter-spacing:0.04em;
}
.tut-start-btn:hover{opacity:0.88}
.tut-swipe-hint{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:0.85em;font-weight:700;color:var(--green);
  padding:13px 0;letter-spacing:0.02em;
  animation:tutHintPulse 1.6s ease-in-out infinite;
}
.tut-swipe-hint-arrow{font-size:1.1em;line-height:1}
@keyframes tutHintPulse{
  0%,100%{opacity:0.55;transform:translateX(0)}
  50%{opacity:1;transform:translateX(4px)}
}

/* チュートリアルカード内 ステップリスト */
.tut-step-list{display:flex;flex-direction:column;gap:7px;width:100%;margin-bottom:10px}
.tut-step-item{
  display:flex;flex-direction:column;
  padding:7px 10px;
  border-left:3px solid var(--c,var(--green));
  background:color-mix(in srgb,var(--c,var(--green)) 6%,#fff);
  border-radius:0 6px 6px 0;
}
.tut-step-head{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.tut-step-num{font-size:0.6em;font-weight:700;color:var(--c,var(--green))}
.tut-step-title{font-size:0.82em;font-weight:700;color:var(--text)}
.tut-step-desc{font-size:0.68em;color:var(--sub);line-height:1.5}
.tut-swipe-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:0}
.tut-card-badge{display:inline-block;align-self:flex-start;font-size:0.65em;font-weight:700;border:1.5px solid;border-radius:20px;padding:2px 12px;margin-bottom:10px}
.tut-card-title{font-size:1.05em;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3}
.tut-card-desc{font-size:0.78em;color:var(--sub);line-height:1.7}

/* レスポンシブ */
@media(max-width:520px){
  .diag-hero h1{font-size:1.3em}
  .page-wrap{padding:0 14px 50px}
  .tut-steps{grid-template-columns:1fr;gap:8px}
}
</style>
</head>

.801c-3.88 14.599-21.478 15.486-27.615 27.108c-5.823 11.028-10.008 21.905-20.978 30.202c-10.618 8.031-18.926 19.898-26.114 31.412c-5.055 8.097-3.073 17.984 3.361 25.893c1.647 2.024 3.995 3.46 5.848 5.336c16.586 16.786 16.962 31.736-.016 47.707c-8.158 7.674-14.381 14.304-17.058 26.753c-2.922 13.585-15.997 16.079-29.821 14.882c-2.413-.209-4.618-1.502-5.873-3.573c-5.594-9.235-12.608-17.022-26.071-17.274c-4.607-.086-8.846-7.331-13.676-10.69c-9.655-6.713-18.92-14.614-29.573-19.135c-22.151-9.402-42.698.371-50.031 23.779c-4.093 13.065-5.305 27.072-7.35 40.724c-1.251 8.354.405 18.681-9.658 21.902c-10.822 3.463-16.598-5.548-22.4-12.78c-11.151-13.9-15.812-30.254-17.701-47.599c-.357-3.277-.139-6.613-.392-9.906c-1.796-23.419-7.282-29.336-28.945-29.163m327.041 101.077c-11.016 6.202-21.02 7.362-31.081-.798c-9.335-7.571-18.422-5.882-27.19.542c-9.041 6.624-17.767 13.683-26.545 20.659c-1.522 1.21-2.772 2.849-3.887 4.469c-10.113 14.685-2.818 32.851 14.975 33.325c18.821.501 36.346 3.037 53.307 11.635c6.787 3.44 15.31 3.454 19.192 4.243c26.194.65 39.793-10.659 39.512-32.801c-.144-11.332-3.902-23.469-9.098-33.678c-7.103-13.956-15.062-15.548-29.185-7.596m-39.301-126.693c1.91-.81 3.851-1.505 5.844-1.976c8.038-1.901 11.297-5.977 14.024-13.948c4.125-12.062 10.179-23.887 17.531-34.321c8.791-12.476 10.33-17.143 1.151-25.104c-3.842-3.333-9.346-4.044-13.883-1.745c-7.223 3.661-13.043 8.213-7.934 20.445c1.161 2.78-1.102 7.553-2.833 10.855c-2.446 4.664-5.422 9.05-8.851 14.311c-1.602 2.459-4.027 4.263-6.822 5.161c-9.908 3.183-15.045 7.477-15.724 13.758c-1.014 9.381 8.811 16.248 17.497 12.564m-33.615 94.611c14.82 2.168 29.641 4.498 44.55 5.734c2.388.198 6.665-4.305 7.507-7.344c1.711-6.176-2.485-10.673-8.296-10.982c-12.456-.664-25.022-.722-37.437.279c-2.369.191-4.558 2.606-6.71 4.96c-1.692 1.85-1.948 4.67-.458 6.686c.286.387.551.624.844.667m-156.921 18.856c-4.232 2.101-9.252 5.188-10.894 9.161c-1.079 2.61.084 6.147 1.25 10.44c.639 2.351 3.3 3.506 5.445 2.351c3.714-2 6.388-3.254 7.835-5.354c2.292-3.32 <script>
sessionStorage.removeItem('diag_counted');
// ===== 質問データ =====
const BASE_QUESTIONS = {
  PF: [
    {yesVal:'P', text:'計画を立てて、あれこれ調べている段階が一番ワクワクする'},
    {yesVal:'F', text:'旅行の当日、その日の気分で行き先を変更することがよくある'},
    {yesVal:'F', text:'観光地のチケットを事前に買っておらず、当日その場で並ぶことがよくある'},
    {yesVal:'P', text:'計画が崩れたときはまず立て直そうとするが、それが難しい状況になるとストレスを感じる'},
  ],
  CN: [
    {yesVal:'C', text:'旅先に歴史的な建造物や美術館、古い街並みがあると、テンションが上がる'},
    {yesVal:'N', text:'世界遺産を訪れるなら、歴史や宗教の「文化遺産」よりも、絶景や秘境の「自然遺産」に惹かれる'},
    {yesVal:'C', text:'旅先では、地元の人しかいないような居酒屋や食堂で、現地の人と話してみたい'},
    {yesVal:'N', text:'旅先を選ぶときは、シュノーケリングやトレッキング、野生動物に出会うような「自然体験」をいちばん楽しみにしている'},
  ],
  SL: [
    {yesVal:'S', text:'旅先でいい景色や美味しいものに出会ったとき、その場ですぐに誰かと共感したい'},
    {yesVal:'L', text:'誰かと一緒の旅行でも、数時間くらいは1人で自由にぶらぶらする時間が欲しい'},
    {yesVal:'S', text:'一緒に行く人の「ここに行きたい」「これ食べたい」に合わせるのは、全く苦にならない'},
    {yesVal:'L', text:'旅先であっても、起きる時間やご飯を食べるタイミングは、自分のペースで決めたい'},
  ],
  HW: [
    {yesVal:'H', text:'宿はただ寝るだけの場所ではなく、清潔で設備が整った空間でホテルステイそのものも快適に楽しみたい'},
    {yesVal:'W', text:'観光地化されていない、現地らしい不便な場所にこそ行ってみたい'},
    {yesVal:'H', text:'移動で体力を削られたくないので、お金を払ってでも快適な移動手段を選びたい'},
    {yesVal:'W', text:'言葉が通じない、停電が起きるといった「想定外のハプニング」ほど燃える'},
  ],
};

const BACKUP_QUESTIONS = {
  PF: {axis:'PF', yesVal:'F', text:'旅行から帰ったあとに、「あそこも見ておけばよかった」と気づくことがよくある'},
  CN: {axis:'CN', yesVal:'C', text:'「現地の歴史や文化を深く知るツアー」と「息をのむような絶景を巡るツアー」なら、迷わず前者の歴史ツアーを選ぶ'},
  SL: {axis:'SL', yesVal:'S', text:'そもそも「一人旅」にはあまり興味がなく、旅行は誰かと一緒に行く方が楽しい'},
  HW: {axis:'HW', yesVal:'W', text:'万が一に備えてあれこれ荷物を詰めるより、リュック1つで身軽に旅立つ方に憧れる'},
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledBase() {
  const all = [];
  Object.entries(BASE_QUESTIONS).forEach(([axis, qs]) => {
    qs.forEach(q => all.push({...q, axis}));
  });
  return shuffle(all);
}

// ===== スワイプUI =====
let currentIdx = 0;
let totalQuestions = 16;
let axisVotes = {};
let questionQueue = [];
let mouseMoveHandler = null;
let mouseUpHandler = null;
let touchStartHandler = null;
let touchMoveHandler = null;
let touchEndHandler = null;
let mouseDownHandler = null;

function getOppositeVal(v) {
  return {P:'F',F:'P',C:'N',N:'C',S:'L',L:'S',H:'W',W:'H'}[v];
}


function initSwipe() {
  questionQueue = buildShuffledBase();
  currentIdx = 0;
  totalQuestions = 16;
  axisVotes = {PF:{P:0,F:0}, CN:{C:0,N:0}, SL:{S:0,L:0}, HW:{H:0,W:0}};
  // updateProgress(0, 16);

  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';

  [...questionQueue].reverse().forEach((q, revIdx) => {
    const realIdx = questionQueue.length - 1 - revIdx;
    appendCard(q, realIdx + 1, Math.min(realIdx, 3));
  });

  attachSwipeHandlers();
}

function appendCard(q, displayNum, behind, isBackup) {
  const stack = document.getElementById('card-stack');
  const card = document.createElement('div');
  card.className = 'swipe-card';
  if (behind > 0) card.dataset.behind = String(behind);

  const pct = Math.min(100, Math.round((displayNum - 1) / totalQuestions * 100));
  const qnumHtml = isBackup
    ? `<span class="sc-qnum-num">Q${displayNum}</span><span class="sc-backup-badge">追加問題</span>`
    : `<span class="sc-qnum-num">Q${displayNum}</span><span class="sc-qnum-total">/ ${totalQuestions}</span>`;

  card.innerHTML = `
    <div class="sc-overlay sc-overlay-l"></div>
    <div class="sc-overlay sc-overlay-r"></div>
    <div class="sc-progress"><div class="sc-progress-fill" style="width:${pct}%"></div></div>
    <div class="sc-body">
      <div class="sc-text-wrap">
        <div>
          <div class="sc-qnum">${qnumHtml}</div>
          <div class="sc-text">${q.text}</div>
        </div>
      </div>
    </div>
    <div class="sc-choices">
      <div class="sc-choice sc-left">
        <span class="sc-choice-arrow">←</span>
        <span class="sc-choice-label">いいえ</span>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-choice sc-right">
        <span class="sc-choice-label">はい</span>
        <span class="sc-choice-arrow">→</span>
      </div>
    </div>`;
  stack.appendChild(card);
}

function getActiveCard() {
  const cards = document.querySelectorAll('.swipe-card');
  return cards.length ? cards[cards.length - 1] : null;
}

function attachSwipeHandlers() {
  const stack = document.getElementById('card-stack');
  if (mouseMoveHandler) document.removeEventListener('mousemove', mouseMoveHandler);
  if (mouseUpHandler)   document.removeEventListener('mouseup',   mouseUpHandler);
  if (touchStartHandler) stack.removeEventListener('touchstart', touchStartHandler);
  if (touchMoveHandler)  stack.removeEventListener('touchmove',  touchMoveHandler);
  if (touchEndHandler)   stack.removeEventListener('touchend',   touchEndHandler);
  if (mouseDownHandler)  stack.removeEventListener('mousedown',  mouseDownHandler);

  let startX = 0, startY = 0, isDragging = false;
  let activeCard = null;
  let lastTouchTime = 0;
  let startTarget = null;
  const THRESHOLD = 90;

  function onStart(x, y, target) {
    if (isDragging) return;
    activeCard = getActiveCard();
    if (!activeCard) return;
    startX = x; startY = y;
    startTarget = target || null;
    isDragging = true;
    activeCard.style.transition = 'none';
    activeCard.style.animation = 'none';
  }

  function onMove(x, y) {
    if (!isDragging || !activeCard) return;
    const dx = x - startX;
    const dy = y - startY;
    if (Math.abs(dy) > Math.abs(dx) * 1.8 && Math.abs(dx) < 20) {
      isDragging = false; return;
    }

    activeCard.style.transform = `translateX(${dx}px) rotate(${dx / 320 * 18}deg)`;
    const pct = Math.min(Math.abs(dx) / THRESHOLD, 1);
    const ovlL = activeCard.querySelector('.sc-overlay-l');
    const ovlR = activeCard.querySelector('.sc-overlay-r');

    if (dx < 0) {
      ovlL.style.opacity = pct; ovlR.style.opacity = 0;
      activeCard.classList.add('dragging-left'); activeCard.classList.remove('dragging-right');
    } else if (dx > 0) {
      ovlR.style.opacity = pct; ovlL.style.opacity = 0;
      activeCard.classList.add('dragging-right'); activeCard.classList.remove('dragging-left');
    } else {
      ovlL.style.opacity = 0; ovlR.style.opacity = 0;
      activeCard.classList.remove('dragging-left','dragging-right');
    }
  }

  function onEnd(x) {
    if (!isDragging || !activeCard) return;
    isDragging = false;
    const dx = x - startX;
    const isTutorial = !!activeCard.dataset.tutorial;
    const tapChoice = Math.abs(dx) < 10 && startTarget && startTarget.closest && startTarget.closest('.sc-choice');
    const tapDir = tapChoice ? (tapChoice.classList.contains('sc-right') ? 'right' : 'left') : null;
    if (tapDir && (!isTutorial || tapDir === 'right')) {
      commitSwipe(tapDir, activeCard);
    } else if (Math.abs(dx) >= THRESHOLD && (!isTutorial || dx > 0)) {
      commitSwipe(dx > 0 ? 'right' : 'left', activeCard);
    } else {
      activeCard.style.transition = 'transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275)';
      activeCard.style.transform = '';
      activeCard.querySelector('.sc-overlay-l').style.opacity = 0;
      activeCard.querySelector('.sc-overlay-r').style.opacity = 0;
      activeCard.classList.remove('dragging-left','dragging-right');
      const snapBackCard = activeCard;
      setTimeout(() => { snapBackCard.style.animation = ''; }, 360);
    }
    activeCard = null;
  }

  touchStartHandler = e => { lastTouchTime = Date.now(); onStart(e.touches[0].clientX, e.touches[0].clientY, e.target); };
  touchMoveHandler  = e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  };
  touchEndHandler  = e => { lastTouchTime = Date.now(); e.preventDefault(); onEnd(e.changedTouches[0].clientX); };
  mouseDownHandler = e => {
    if (Date.now() - lastTouchTime < 700) return;
    e.preventDefault(); onStart(e.clientX, e.clientY, e.target);
  };

  stack.addEventListener('touchstart', touchStartHandler, {passive:true});
  stack.addEventListener('touchmove', touchMoveHandler, {passive:false});
  stack.addEventListener('touchend', touchEndHandler);
  stack.addEventListener('mousedown', mouseDownHandler);

  mouseMoveHandler = e => onMove(e.clientX, e.clientY);
  mouseUpHandler   = e => onEnd(e.clientX);
  document.addEventListener('mousemove', mouseMoveHandler);
  document.addEventListener('mouseup',   mouseUpHandler);
}

function commitSwipe(dir, card) {
  if (card.dataset.tutorial) { advanceTutorialCard(card, dir); return; }
  if (card.dataset.committed) return;
  card.dataset.committed = '1';
  const q = questionQueue[currentIdx];
  const val = dir === 'right' ? q.yesVal : getOppositeVal(q.yesVal);
  axisVotes[q.axis][val]++;

  const flyX = dir === 'right' ? window.innerWidth + 100 : -(window.innerWidth + 100);
  card.style.transition = 'transform 0.45s cubic-bezier(0.55,0,1,0.7),opacity 0.35s';
  card.style.transform  = `translateX(${flyX}px) rotate(${dir==='right'?25:-25}deg)`;
  card.style.opacity = '0';
  card.style.pointerEvents = 'none';

  currentIdx++;
  // updateProgress(currentIdx, totalQuestions);

  const remaining = Array.from(document.querySelectorAll('.swipe-card')).filter(c => c !== card);
  const n = remaining.length;
  remaining.forEach((c, i) => {
    const behind = n - 1 - i;
    if (behind === 0) {
      c.style.transition = 'transform 0.3s ease';
      void c.getBoundingClientRect();
      c.removeAttribute('data-behind');
    } else {
      c.dataset.behind = String(Math.min(behind, 3));
    }
  });

  setTimeout(() => {
    card.remove();

    if (currentIdx === 16) {
      const tiedAxes = Object.keys(axisVotes).filter(axis => {
        const vals = Object.values(axisVotes[axis]);
        return vals[0] === vals[1];
      });

      if (tiedAxes.length > 0) {
        totalQuestions = 16 + tiedAxes.length;
        // updateProgress(currentIdx, totalQuestions);
        [...tiedAxes].reverse().forEach((axis, revIdx) => {
          const bIdx = tiedAxes.length - 1 - revIdx;
          const bq = BACKUP_QUESTIONS[axis];
          questionQueue.push(bq);
          appendCard(bq, 16 + bIdx + 1, Math.min(bIdx, 3), true);
        });
      } else {
        finishQuiz();
      }
    } else if (currentIdx === totalQuestions) {
      finishQuiz();
    }
  }, 500);
}

function finishQuiz() {
  const pf = axisVotes.PF.P >= axisVotes.PF.F ? 'P' : 'F';
  const cn = axisVotes.CN.C >= axisVotes.CN.N ? 'C' : 'N';
  const sl = axisVotes.SL.S >= axisVotes.SL.L ? 'S' : 'L';
  const hw = axisVotes.HW.H >= axisVotes.HW.W ? 'H' : 'W';
  const type = pf + cn + sl + hw;
  sessionStorage.setItem('myType', type);
  sessionStorage.setItem('myVotes', JSON.stringify(axisVotes));
  location.href = 'result.html?type=' + type;
}


const TUTORIAL_STEPS = [
  { num:1, color:'#2a9d82', title:'診断を完了',
    desc:'今の旅行スタイルを知るというよりも，理想の旅行スタイルを見つけるのが目的です．' },
  { num:2, color:'#3a6a9a', title:'詳細な結果を見る',
    desc:'自分の性格と相性のいいタイプがわかります．' },
  { num:3, color:'#8a5ea0', title:'次の停車駅は',
    desc:'あなたのスタイルにぴったりの旅先を提案します．',
    hintLabel:'右にスワイプして診断スタート' },
];

function showTutorial() {
  const stack = document.getElementById('card-stack');
  [...TUTORIAL_STEPS].reverse().forEach((step, ri) => {
    const realIdx = TUTORIAL_STEPS.length - 1 - ri;
    const card = document.createElement('div');
    card.className = realIdx === 0 ? 'swipe-card tut-sway' : 'swipe-card';
    card.dataset.tutorial = '1';
    if (realIdx > 0) card.dataset.behind = String(realIdx);
    card.innerHTML = `
      <div class="sc-overlay sc-overlay-l"></div>
      <div class="sc-overlay sc-overlay-r"></div>
      <div class="sc-body">
        <div class="sc-text-wrap">
          <div>
            <div class="tut-card-badge" style="color:${step.color};border-color:${step.color}">ステップ${step.num}</div>
            <div class="tut-card-title">${step.title}</div>
            <div class="tut-card-desc">${step.desc}</div>
          </div>
        </div>
      </div>
      <div style="padding:10px 14px;border-top:1px solid var(--border)">
        <div class="tut-swipe-hint"><span class="tut-swipe-hint-arrow">→</span> ${step.hintLabel || '右にスワイプして次へ'}</div>
      </div>`;
    stack.appendChild(card);
  });
  attachSwipeHandlers();
}

function advanceTutorialCard(card, dir) {
  const flyX = (dir === 'left' ? -1 : 1) * (window.innerWidth + 100);
  card.style.transition = 'transform 0.45s cubic-bezier(0.55,0,1,0.7),opacity 0.35s';
  card.style.transform  = `translateX(${flyX}px) rotate(${dir==='left'?-25:25}deg)`;
  card.style.opacity = '0';
  card.style.pointerEvents = 'none';

  const remaining = [...document.querySelectorAll('.swipe-card[data-tutorial]')].filter(c => c !== card);
  const n = remaining.length;
  remaining.forEach((c, i) => {
    const behind = n - 1 - i;
    if (behind === 0) {
      c.classList.remove('tut-sway');
      c.style.transition = 'transform 0.3s ease';
      void c.getBoundingClientRect();
      c.removeAttribute('data-behind');
      setTimeout(() => c.classList.add('tut-sway'), 320);
    } else {
      c.dataset.behind = String(Math.min(behind, 3));
    }
  });

  setTimeout(() => {
    card.remove();
    if (remaining.length === 0) initSwipe();
  }, 450);
}

showTutorial();

function toggleHbMenu() {
  document.getElementById('hb-btn').classList.toggle('open');
  document.getElementById('hb-panel').classList.toggle('open');
}
document.addEventListener('click', e => {
  const wrap = document.querySelector('.hb-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('hb-btn').classList.remove('open');
    document.getElementById('hb-panel').classList.remove('open');
  }
});
</script>
