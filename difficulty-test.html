<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行難易度 デザイン案比較</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f5f7f5;color:#1a1a1a;font-size:16px;line-height:1.7;padding:20px}
h1{font-size:1.1em;font-weight:900;margin-bottom:20px;color:#333}
.case{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:20px}
.case-label{font-size:0.78em;font-weight:700;color:#888;margin-bottom:12px;border-bottom:1px solid #f0f0f0;padding-bottom:8px}
</style>
</head>
<body>

<h1>旅行難易度 デザイン案比較（マレーシア = やさしい）</h1>

<!-- 案A：3ゾーン色分けバー -->
<div class="case">
  <div class="case-label">案A：3ゾーン色分けバー</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span style="font-size:1.2em">🧭</span>
    <span style="font-size:0.82em;font-weight:700;color:#555">旅行難易度</span>
  </div>
  <div style="position:relative;height:20px;border-radius:20px;overflow:hidden;display:flex">
    <div style="flex:1;background:#00b06b"></div>
    <div style="flex:1;background:#f5c200"></div>
    <div style="flex:1;background:#e84040"></div>
  </div>
  <!-- マーカー -->
  <div style="position:relative;margin-top:4px">
    <div style="position:absolute;left:16%;transform:translateX(-50%);font-size:0.75em;color:#00b06b;font-weight:900;text-align:center">▲<br>やさしい</div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:0.72em;color:#bbb;margin-top:28px">
    <span>やさしい</span><span>ふつう</span><span>むずかしい</span>
  </div>
</div>

<!-- 案B：グラデーション＋縦線マーカー -->
<div class="case">
  <div class="case-label">案B：グラデーション＋縦線マーカー</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:1.2em">🧭</span>
      <span style="font-size:0.82em;font-weight:700;color:#555">旅行難易度</span>
    </div>
    <span style="background:#e8f5ee;color:#006847;font-size:0.78em;font-weight:700;padding:3px 12px;border-radius:20px">やさしい</span>
  </div>
  <div style="position:relative;height:14px;border-radius:20px;overflow:visible;background:linear-gradient(90deg,#00c06b 0%,#f5c200 50%,#e84040 100%)">
    <div style="position:absolute;left:20%;top:-4px;width:4px;height:22px;background:#fff;border-radius:4px;box-shadow:0 0 0 2px #333"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:0.72em;color:#bbb;margin-top:6px">
    <span>← やさしい</span><span>むずかしい →</span>
  </div>
</div>

<!-- 案C：セグメント（ブロック分割）バー -->
<div class="case">
  <div class="case-label">案C：セグメント（ブロック分割）バー</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:1.2em">🧭</span>
      <span style="font-size:0.82em;font-weight:700;color:#555">旅行難易度</span>
    </div>
    <span style="background:#e8f5ee;color:#006847;font-size:0.78em;font-weight:700;padding:3px 12px;border-radius:20px">やさしい</span>
  </div>
  <div style="display:flex;gap:5px">
    <div style="flex:1;height:18px;border-radius:6px;background:#00b06b"></div>
    <div style="flex:1;height:18px;border-radius:6px;background:#00b06b;opacity:0.5"></div>
    <div style="flex:1;height:18px;border-radius:6px;background:#e0e0e0"></div>
    <div style="flex:1;height:18px;border-radius:6px;background:#e0e0e0"></div>
    <div style="flex:1;height:18px;border-radius:6px;background:#e0e0e0"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:0.72em;color:#bbb;margin-top:5px">
    <span>← やさしい</span><span>むずかしい →</span>
  </div>
</div>

<!-- 案D：太バー＋ラベル直書き -->
<div class="case">
  <div class="case-label">案D：太バー＋ラベル直書き</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span style="font-size:1.2em">🧭</span>
    <span style="font-size:0.82em;font-weight:700;color:#555">旅行難易度</span>
  </div>
  <div style="position:relative;background:#e8e8e8;border-radius:20px;height:32px;overflow:hidden">
    <div style="width:28%;height:100%;background:linear-gradient(90deg,#00a86b,#66cc99);border-radius:20px;display:flex;align-items:center;padding-left:14px">
      <span style="font-size:0.82em;font-weight:900;color:#fff;white-space:nowrap">やさしい</span>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:0.72em;color:#bbb;margin-top:5px">
    <span>← やさしい</span><span>むずかしい →</span>
  </div>
</div>

<!-- 案E：項目別ミニバー -->
<div class="case">
  <div class="case-label">案E：項目別ミニバー</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:1.2em">🧭</span>
      <span style="font-size:0.82em;font-weight:700;color:#555">旅行難易度</span>
    </div>
    <span style="background:#e8f5ee;color:#006847;font-size:0.78em;font-weight:700;padding:3px 12px;border-radius:20px">総合：やさしい</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:7px">
    <!-- 言語 -->
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.75em;color:#555;width:44px;flex-shrink:0">言語</span>
      <div style="flex:1;background:#e8e8e8;border-radius:20px;height:8px;overflow:hidden">
        <div style="width:25%;height:100%;background:#00b06b;border-radius:20px"></div>
      </div>
      <span style="font-size:0.7em;color:#00b06b;font-weight:700;width:44px">やさしい</span>
    </div>
    <!-- 治安 -->
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.75em;color:#555;width:44px;flex-shrink:0">治安</span>
      <div style="flex:1;background:#e8e8e8;border-radius:20px;height:8px;overflow:hidden">
        <div style="width:35%;height:100%;background:#00b06b;border-radius:20px"></div>
      </div>
      <span style="font-size:0.7em;color:#00b06b;font-weight:700;width:44px">やさしい</span>
    </div>
    <!-- 交通 -->
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.75em;color:#555;width:44px;flex-shrink:0">交通</span>
      <div style="flex:1;background:#e8e8e8;border-radius:20px;height:8px;overflow:hidden">
        <div style="width:45%;height:100%;background:#f5c200;border-radius:20px"></div>
      </div>
      <span style="font-size:0.7em;color:#b89000;font-weight:700;width:44px">ふつう</span>
    </div>
    <!-- ビザ -->
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.75em;color:#555;width:44px;flex-shrink:0">ビザ</span>
      <div style="flex:1;background:#e8e8e8;border-radius:20px;height:8px;overflow:hidden">
        <div style="width:10%;height:100%;background:#00b06b;border-radius:20px"></div>
      </div>
      <span style="font-size:0.7em;color:#00b06b;font-weight:700;width:44px">不要</span>
    </div>
    <!-- 食事 -->
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:0.75em;color:#555;width:44px;flex-shrink:0">食事</span>
      <div style="flex:1;background:#e8e8e8;border-radius:20px;height:8px;overflow:hidden">
        <div style="width:20%;height:100%;background:#00b06b;border-radius:20px"></div>
      </div>
      <span style="font-size:0.7em;color:#00b06b;font-weight:700;width:44px">やさしい</span>
    </div>
  </div>
</div>

</body>
</html>
